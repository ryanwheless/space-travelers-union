<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ABYSSAL</title>
<style>
  :root{
    --ink:#04060f;
    --ui:#7fe9dd;
    --ui-dim:rgba(127,233,221,.42);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ink);color:var(--ui);overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
  }
  #stage{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    display:block;background:#000;
  }

  /* ——— overlay chrome ——— */
  #ui{position:fixed;inset:0;pointer-events:none;transition:opacity .5s ease}
  #ui.hidden{opacity:0}
  .corner{
    position:absolute;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ui-dim);text-shadow:0 0 12px rgba(95,245,230,.35);white-space:nowrap;
  }
  #phase{top:max(18px,env(safe-area-inset-top));left:max(20px,env(safe-area-inset-left));
    font-size:11px;letter-spacing:.42em;color:rgba(159,247,238,.78)}
  #phase b{font-weight:400;display:inline-block;min-width:74px}
  #phase i{font-style:normal;opacity:.45;margin-left:10px}
  #meta{bottom:max(18px,env(safe-area-inset-bottom));left:max(20px,env(safe-area-inset-left));line-height:1.9}
  #hint{bottom:max(18px,env(safe-area-inset-bottom));right:max(20px,env(safe-area-inset-right));text-align:right;line-height:1.9;opacity:.55}
  #rare{
    top:max(18px,env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));
    color:#ffd98a;text-shadow:0 0 18px rgba(255,217,138,.7);opacity:0;transition:opacity .6s ease;
  }
  #rare.on{opacity:.95;transition:opacity .12s ease}

  /* ——— entry ——— */
  #gate{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:26px;background:#04060f;z-index:9;cursor:pointer;
    transition:opacity 1.6s ease;
  }
  #gate.gone{opacity:0;pointer-events:none}
  #gate h1{
    margin:0;font-weight:300;font-size:clamp(26px,6.2vw,54px);letter-spacing:.62em;
    text-indent:.62em;color:#bff6ee;
    animation:breathe 5.2s ease-in-out infinite;
  }
  #gate p{margin:0;font-size:10px;letter-spacing:.34em;color:rgba(127,233,221,.3);text-transform:uppercase}
  @keyframes breathe{
    0%,100%{opacity:.4;text-shadow:0 0 26px rgba(95,245,230,.18)}
    50%    {opacity:1; text-shadow:0 0 60px rgba(95,245,230,.6),0 0 120px rgba(139,108,255,.28)}
  }

  /* ——— keymap ——— */
  #keys{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:8;
    background:rgba(4,6,15,.86);backdrop-filter:blur(6px);
  }
  #keys.on{display:flex}
  #keys table{border-collapse:collapse;font-size:11px;letter-spacing:.16em}
  #keys td{padding:7px 22px 7px 0;color:rgba(127,233,221,.62);text-transform:uppercase}
  #keys td:first-child{color:#ffd98a;text-align:right;padding-right:26px}
  @media (prefers-reduced-motion: reduce){
    #gate h1{animation-duration:9s}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="gate">
  <h1>DESCEND</h1>
  <p>click to begin</p>
</div>

<div id="ui">
  <div class="corner" id="phase"><b>—</b><i></i></div>
  <div class="corner" id="rare">◈ RARE</div>
  <div class="corner" id="meta"></div>
  <div class="corner" id="hint">? keys</div>
</div>

<div id="keys">
  <table>
    <tr><td>space</td><td>pause / resume</td></tr>
    <tr><td>m</td><td>mute</td></tr>
    <tr><td>r</td><td>reseed</td></tr>
    <tr><td>1 – 4</td><td>jump to phase</td></tr>
    <tr><td>← →</td><td>tempo ∓ 4 bpm</td></tr>
    <tr><td>v</td><td>vertical 9:16</td></tr>
    <tr><td>f</td><td>fullscreen</td></tr>
    <tr><td>h</td><td>hide interface</td></tr>
    <tr><td>?</td><td>close</td></tr>
  </table>
</div>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════════════
   ABYSSAL — a generative synth-arpeggio machine with a piano visualizer.
   One file. No dependencies. No network. No samples.
   ════════════════════════════════════════════════════════════════════════════ */

/* ——————————————————————————————————————————————————————————————————————————
   SEED + RNG          every random decision routes through here, so ?seed=
   reproduces a run exactly.
   —————————————————————————————————————————————————————————————————————————— */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seedFromString(s){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
let SEED = (new URLSearchParams(location.search).get('seed') || '').trim();
if (!SEED) SEED = (Math.random() * 0xFFFFFF | 0).toString(36).toUpperCase().padStart(4,'0');
let rng = mulberry32(seedFromString(SEED));

const rnd   = () => rng();
const rr    = (a,b) => a + rng() * (b - a);
const ri    = (a,b) => Math.floor(a + rng() * (b - a + 1));
const pick  = arr => arr[Math.floor(rng() * arr.length)];
const chance= p => rng() < p;
/** weighted pick from {key: weight} — returns key as a number */
function wpick(table){
  let total = 0; for (const k in table) total += table[k];
  let r = rng() * total;
  for (const k in table){ r -= table[k]; if (r <= 0) return +k; }
  return +Object.keys(table)[0];
}
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;
const TAU = Math.PI * 2;

/* ——————————————————————————————————————————————————————————————————————————
   THEORY
   Modes are pitch-class sets. Everything downstream thinks in *scale steps*,
   never semitones, so a modulation costs one table swap and nothing else.
   —————————————————————————————————————————————————————————————————————————— */
const MODES = {
  dorian:      [0,2,3,5,7,9,10],   // home. the raised 6th is the whole point.
  aeolian:     [0,2,3,5,7,8,10],   // darker
  phrygianDom: [0,1,4,5,7,8,10],   // ritual / occult
  lydian:      [0,2,4,6,7,9,11]    // the lift
};

/** pitch of a scale step, where step may be any integer (negative or > 7) */
function scalePitch(tonic, mode, step){
  const s = MODES[mode];
  const oct = Math.floor(step / 7);
  const idx = ((step % 7) + 7) % 7;
  return tonic + 12 * oct + s[idx];
}

/* Voicings are scale-step offsets from the chord root.
   0=root 1=2nd 2=3rd 3=4th 4=5th 5=6th 6=7th 7=8ve 8=9th 9=10th 10=11th 11=12th
   Note what is absent: nothing here is a plain triad. */
const VOICINGS = {
  m11:      [0,4,6,8,10],      // root 5 7 9 11
  add9:     [0,2,4,8],
  sus2:     [0,1,4,8],
  sus4:     [0,3,4,7],
  maj7s11:  [0,2,4,6,10],      // the #11 arrives free in lydian
  m69:      [0,2,4,5,8],
  quartal:  [0,3,6,9],         // stacked 4ths
  quartal2: [0,3,6,8]
};
const VOICING_KEYS = Object.keys(VOICINGS);

/* Markov table over scale degrees (0 = tonic). Weighted toward the two moves
   this piece is built on: i → ♭VII → IV → i, and the plagal descent iv → i. */
const PROG = {
  0: {6:0.28, 4:0.19, 3:0.19, 5:0.14, 2:0.14, 1:0.06},
  1: {0:0.50, 3:0.30, 6:0.20},
  2: {3:0.50, 6:0.30, 0:0.20},
  3: {0:0.48, 4:0.27, 6:0.20, 1:0.05},
  4: {2:0.40, 0:0.38, 3:0.22},
  5: {0:0.40, 3:0.32, 6:0.28},
  6: {3:0.50, 0:0.30, 2:0.20}
};

/** Degrees that actually carry tension. ♭VII (6) is the warm one this piece leans
    on hardest — marking it tense turned the whole palette coral. The supertonic is
    always tense; the dominant only sometimes, so the colour stays an event. */
const TENSE_DEGREES = new Set([1, 4]);

/**
 * Voice leading. Hold common tones; move everything else by the smallest
 * available interval. This single function is the difference between
 * "beautiful" and "a list of correct notes".
 */
function voiceLead(prev, tones, lo, hi){
  if (!prev || !prev.length){
    return tones.map(t => {
      while (t < lo) t += 12;
      while (t > hi) t -= 12;
      return t;
    }).sort((a,b) => a - b);
  }
  const out = [];
  for (const tone of tones){
    let best = null, bestDist = Infinity;
    for (let o = -3; o <= 3; o++){
      const cand = tone + 12 * o;
      if (cand < lo || cand > hi) continue;
      let d = Infinity;
      for (const p of prev) d = Math.min(d, Math.abs(cand - p));
      // tiny penalty for doubling a pitch already in the voicing
      if (out.indexOf(cand) >= 0) d += 6;
      if (d < bestDist){ bestDist = d; best = cand; }
    }
    if (best === null){
      best = clamp(tone, lo, hi);
    }
    out.push(best);
  }
  // dedupe, keep sorted
  const uniq = [...new Set(out)].sort((a,b) => a - b);
  return uniq;
}

const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const pc   = m => ((m % 12) + 12) % 12;

/* ——————————————————————————————————————————————————————————————————————————
   AUDIO ENGINE
   voice ─┬─ dry ───────────────────────────┐
          ├─ delaySend → pingPong ──────────┤→ bus → saturate → pump → limiter → out
          └─ verbSend  → convolver ─────────┘
   —————————————————————————————————————————————————————————————————————————— */
const Audio = {
  ctx: null, ready: false,
  bus: null, master: null, pump: null,
  dSend: null, vSend: null,
  padOsc: [], padGain: null, padFilter: null
};

function buildAudio(){
  const ctx = Audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
  // WebKit hands over the audio session only for something played during the
  // gesture itself, so claim it before spending any time on the graph.
  unlockAudioSession(ctx);
  if (ctx.state !== 'running') ctx.resume().catch(() => {});

  // —— master chain, built back to front ——
  const master = ctx.createGain();
  master.gain.value = 0.0;                       // faded in by the intro
  master.connect(ctx.destination);

  // limiter: brick-ish, so nothing ever clips no matter how dense it gets
  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -6;
  limiter.knee.value      = 0;
  limiter.ratio.value     = 20;
  limiter.attack.value    = 0.002;
  limiter.release.value   = 0.18;
  limiter.connect(master);

  // sidechain pump — the thing that makes it sound produced rather than demoed
  const pump = ctx.createGain();
  pump.gain.value = 1;
  pump.connect(limiter);

  // gentle tanh saturation
  const sat = ctx.createWaveShaper();
  {
    const n = 2048, c = new Float32Array(n);
    for (let i = 0; i < n; i++){
      const x = (i / (n - 1)) * 2 - 1;
      c[i] = Math.tanh(x * 1.8) / Math.tanh(1.8);
    }
    sat.curve = c; sat.oversample = '2x';
  }
  sat.connect(pump);

  const bus = ctx.createGain();
  bus.gain.value = 0.9;
  bus.connect(sat);

  // —— ping-pong delay, dotted 8th, lowpassed feedback ——
  const dSend = ctx.createGain(); dSend.gain.value = 1;
  const dL = ctx.createDelay(2), dR = ctx.createDelay(2);
  const fb = ctx.createGain(); fb.gain.value = 0.38;
  const fbLP = ctx.createBiquadFilter(); fbLP.type = 'lowpass'; fbLP.frequency.value = 1850;
  const merge = ctx.createChannelMerger(2);
  const dWet = ctx.createGain(); dWet.gain.value = 0.30;
  dSend.connect(dL);
  dL.connect(dR); dR.connect(fbLP); fbLP.connect(fb); fb.connect(dL);   // cross-fed
  dL.connect(merge, 0, 0);
  dR.connect(merge, 0, 1);
  merge.connect(dWet); dWet.connect(bus);

  // —— procedural convolution reverb: filtered, exponentially decaying noise ——
  const vSend = ctx.createGain(); vSend.gain.value = 1;
  const conv  = ctx.createConvolver();
  conv.buffer = makeImpulse(ctx, 3.5, 2.6);
  const vWet  = ctx.createGain(); vWet.gain.value = 0.42;
  const vLP   = ctx.createBiquadFilter(); vLP.type = 'lowpass'; vLP.frequency.value = 3200;
  vSend.connect(vLP); vLP.connect(conv); conv.connect(vWet); vWet.connect(bus);

  // —— the trench drone: 3 detuned saws under a very slow filter LFO ——
  const padGain = ctx.createGain(); padGain.gain.value = 0.0;
  const padFilter = ctx.createBiquadFilter();
  padFilter.type = 'lowpass'; padFilter.frequency.value = 420; padFilter.Q.value = 4;
  padGain.connect(padFilter);
  padFilter.connect(bus);
  padFilter.connect(vSend);

  const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
  const lfoAmt = ctx.createGain(); lfoAmt.gain.value = 260;
  lfo.connect(lfoAmt); lfoAmt.connect(padFilter.frequency); lfo.start();

  // each detuned saw gets its own place in the image — stacking them in the centre
  // is what makes a super-saw sound narrow
  const padOsc = [];
  [[-7, -0.68], [0, 0], [7, 0.68]].forEach((spec, i) => {
    const o = ctx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.value = mtof(38);
    o.detune.value = spec[0];
    const g = ctx.createGain(); g.gain.value = i === 1 ? 0.30 : 0.24;
    o.connect(g);
    if (ctx.createStereoPanner){
      const pan = ctx.createStereoPanner(); pan.pan.value = spec[1];
      g.connect(pan); pan.connect(padGain);
    } else g.connect(padGain);
    o.start();
    padOsc.push(o);
  });

  Object.assign(Audio, {
    bus, master, pump, dSend, vSend, dWet, vWet, fb, limiter, dL, dR,
    padOsc, padGain, padFilter, ready: true
  });
}

/** dotted-8th ping-pong, retimed whenever the tempo changes */
function setDelayTime(bpm){
  if (!Audio.dL) return;
  const t = Audio.ctx.currentTime;
  const dotted = (60 / bpm) * 0.75;
  Audio.dL.delayTime.setTargetAtTime(dotted, t, 0.25);
  Audio.dR.delayTime.setTargetAtTime(dotted, t, 0.25);
}

/** Impulse response generated in code: decaying filtered noise, stereo-decorrelated. */
function makeImpulse(ctx, seconds, decay){
  const sr  = ctx.sampleRate;
  const len = Math.floor(sr * seconds);
  const buf = ctx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++){
    const d = buf.getChannelData(ch);
    let lp = 0;
    // a hair of pre-delay difference per channel is what opens the stereo image
    const pre = ch === 0 ? 0 : Math.floor(sr * 0.011);
    for (let i = 0; i < len; i++){
      const t = i / len;
      const env = Math.pow(1 - t, decay);
      const n = (rng() * 2 - 1) * env;
      lp += (n - lp) * 0.34;                        // one-pole lowpass, dark tail
      d[i + pre < len ? i + pre : i] = lp * (1 - t * 0.15);
    }
    // soften the very front so it blooms instead of cracks
    for (let i = 0; i < 400 && i < len; i++) d[i] *= i / 400;
  }
  return buf;
}

/** white noise tile reused by the Karplus-Strong excitation */
function noiseSeed(n){
  const a = new Float32Array(n);
  for (let i = 0; i < n; i++) a[i] = rng() * 2 - 1;
  return a;
}

/* ——— VOICE 1: 2-op FM electric piano. carrier sine, modulator at 14:1 with a
   fast-decaying index — bell attack, woody body. Plus a sine sub an octave down. */
function fmKeys(t, midi, vel, dur, bright){
  const ctx = Audio.ctx;
  const f = mtof(midi);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vel * 0.30), t + 0.004);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vel * 0.11), t + 0.13);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.35);

  const car = ctx.createOscillator();
  car.type = 'sine'; car.frequency.value = f;

  const mod = ctx.createOscillator();
  mod.type = 'sine'; mod.frequency.value = f * 14;
  const mg = ctx.createGain();
  const idx = f * (1.60 + bright * 2.0) * (0.45 + vel * 0.75);
  mg.gain.setValueAtTime(idx, t);
  mg.gain.exponentialRampToValueAtTime(Math.max(1, idx * 0.02), t + 0.12);
  mod.connect(mg); mg.connect(car.frequency);

  const sub = ctx.createOscillator();
  sub.type = 'sine'; sub.frequency.value = f / 2;
  const sg = ctx.createGain(); sg.gain.value = 0.20;      // weight under each note
  sub.connect(sg); sg.connect(g);

  const tone = ctx.createBiquadFilter();
  tone.type = 'lowpass';
  tone.frequency.value = clamp(f * 7.5 + 1650, 1400, 9000);
  tone.Q.value = 0.4;

  car.connect(g); g.connect(tone);
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  const out = pan || ctx.createGain();
  tone.connect(out);
  if (pan) pan.pan.value = clamp((midi - 70) / 24 + rr(-0.06, 0.06), -0.82, 0.82);

  out.connect(Audio.bus);
  const ds = ctx.createGain(); ds.gain.value = 0.42; out.connect(ds); ds.connect(Audio.dSend);
  const vs = ctx.createGain(); vs.gain.value = 0.50; out.connect(vs); vs.connect(Audio.vSend);

  const stop = t + dur + 0.5;
  car.start(t); mod.start(t); sub.start(t);
  car.stop(stop); mod.stop(stop); sub.stop(stop);
  car.onended = () => { try{ out.disconnect(); ds.disconnect(); vs.disconnect(); }catch(e){} };
}

/* ——— VOICE 2: Karplus-Strong pluck, rendered offline into a buffer.
   Doing the string in JS rather than as a feedback graph keeps it deterministic
   and costs nothing at these note densities. */
function ksPluck(t, midi, vel, dur, reverse){
  const ctx = Audio.ctx, sr = ctx.sampleRate;
  const f = mtof(midi);
  const N = Math.max(2, Math.round(sr / f));
  const len = Math.min(Math.floor(sr * (dur + 0.6)), Math.floor(sr * 1.8));
  const buf = ctx.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  const line = noiseSeed(N);
  // soften the excitation so it reads as water, not as a snap
  for (let i = 1; i < N; i++) line[i] = line[i] * 0.5 + line[i-1] * 0.5;
  const damp = 0.5 - clamp((midi - 60) / 260, 0, 0.12);
  let idx = 0, prev = 0;
  for (let i = 0; i < len; i++){
    const cur = line[idx];
    const nx  = line[(idx + 1) % N];
    const avg = (cur * damp + nx * (1 - damp)) * 0.9965;
    line[idx] = avg;
    idx = (idx + 1) % N;
    prev = prev * 0.06 + cur * 0.94;
    d[i] = prev * Math.exp(-i / (sr * (0.35 + dur * 0.5)));
  }
  if (reverse){
    // a genuinely reversed string — swells in instead of decaying out
    for (let i = 0, j = len - 1; i < j; i++, j--){ const tmp = d[i]; d[i] = d[j]; d[j] = tmp; }
  }
  const src = ctx.createBufferSource(); src.buffer = buf;
  const g = ctx.createGain(); g.gain.value = vel * (reverse ? 0.34 : 0.26);
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 240;
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  const out = pan || ctx.createGain();
  if (pan) pan.pan.value = clamp((midi - 70) / 26 + rr(-0.18, 0.18), -0.85, 0.85);
  src.connect(g); g.connect(hp); hp.connect(out);
  out.connect(Audio.bus);
  const ds = ctx.createGain(); ds.gain.value = 0.6; out.connect(ds); ds.connect(Audio.dSend);
  const vs = ctx.createGain(); vs.gain.value = 0.7; out.connect(vs); vs.connect(Audio.vSend);
  src.start(t);
  src.onended = () => { try{ out.disconnect(); ds.disconnect(); vs.disconnect(); }catch(e){} };
}

/* ——— VOICE 3: sine sub bass, slow attack, sits under everything ——— */
function subBass(t, midi, vel, dur){
  const ctx = Audio.ctx;
  const o = ctx.createOscillator();
  o.type = 'sine'; o.frequency.setValueAtTime(mtof(midi), t);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vel * 0.22), t + 0.08);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 175;
  o.connect(g); g.connect(lp); lp.connect(Audio.bus);
  const vs = ctx.createGain(); vs.gain.value = 0.12; lp.connect(vs); vs.connect(Audio.vSend);
  o.start(t); o.stop(t + dur + 0.1);
  o.onended = () => { try{ lp.disconnect(); vs.disconnect(); }catch(e){} };
}

/** retune the drone to a new chord root, with portamento */
function padTo(midi, t){
  const at = Clock.toAudio(t);
  if (!Audio.padOsc.length || at === null) return;
  t = at;
  const f = mtof(midi);
  Audio.padOsc.forEach(o => {
    o.frequency.cancelScheduledValues(t);
    o.frequency.setValueAtTime(o.frequency.value, t);
    o.frequency.exponentialRampToValueAtTime(f, t + 1.4);
  });
}

/** the pump: a dip on beats 1 and 3 with a 180ms recovery */
function schedulePump(t, depth){
  const at = Clock.toAudio(t);
  if (!Audio.ready || at === null) return;
  t = at;
  const g = Audio.pump.gain;
  g.cancelScheduledValues(t);
  g.setValueAtTime(1, t);
  g.linearRampToValueAtTime(1 - depth, t + 0.012);
  g.linearRampToValueAtTime(1, t + 0.19);
}

/* ——————————————————————————————————————————————————————————————————————————
   THE ARRANGER
   36 bars @ 96bpm = 90.0s, and the cycle returns to the same key, the same
   camera position and the same density — so one cycle of screen recording
   loops seamlessly.
   —————————————————————————————————————————————————————————————————————————— */
const PHASES = [
  { name:'DRIFT',   bars: 8,  mode:'dorian',  tonic:45, density:0.38, runP:0.00,
    counter:0.30, lo:50, hi:79, pad:0.052, delay:0.20, verb:0.50, bright:0.34, lvl:0.70 },
  { name:'BLOOM',   bars:10,  mode:'dorian',  tonic:45, density:0.86, runP:0.50,
    counter:0.70, lo:50, hi:83, pad:0.062, delay:0.34, verb:0.42, bright:0.56, lvl:1.00 },
  { name:'DESCENT', bars:10,  mode:'aeolian', tonic:45, density:0.62, runP:0.18,
    counter:0.50, lo:40, hi:74, pad:0.082, delay:0.30, verb:0.55, bright:0.26, lvl:0.82 },
  { name:'SURFACE', bars: 8,  mode:'lydian',  tonic:48, density:0.90, runP:0.80,
    counter:0.80, lo:52, hi:86, pad:0.055, delay:0.42, verb:0.48, bright:0.80, lvl:1.00 }
];
const CYCLE_BARS = PHASES.reduce((a,p) => a + p.bars, 0);   // 36
const PHASE_START = (() => { let a = 0; return PHASES.map(p => { const s = a; a += p.bars; return s; }); })();

const PATTERNS = ['up','down','upDown','downUp','outsideIn','pedal','walk'];

const M = {
  bpm: 96,
  swing: 0.56,
  step: 0,                 // global 16th counter
  nextTime: 0,
  degree: 0,
  voicing: [],
  pool: [],
  pattern: 'up',
  patIdx: 0,
  walkPos: 0,
  phaseIdx: 0,
  phase: PHASES[0],
  chordId: 0,
  curMode: 'dorian',
  tension: 0,
  descentDark: false,
  // one-shot state
  silenceUntil: -1,
  bigChordAt: -1,
  leviathanUntil: -1,
  cascade: null,
  lastRareBar: -99,
  nextSilBar: 6,
  started: false,
  muted: false,
  paused: false,
  audioError: null
};

/**
 * The piece runs on "piece time", not on the AudioContext.
 * The audio clock is authoritative whenever it is running — that's what keeps
 * light and sound on the same frame — but if audio never starts, or is blocked,
 * or dies, piece time falls back to the wall clock and the visuals carry on.
 * Previously everything read AudioContext.currentTime directly, so one failure
 * in the audio graph took the entire piece down with it.
 */
const Clock = {
  perf0: 0,
  audioOffset: null,            // ctx.currentTime - pieceTime, once audio is live
  begin(){ this.perf0 = performance.now(); this.audioOffset = null; },
  now(){
    return this.audioOffset !== null
      ? Audio.ctx.currentTime - this.audioOffset
      : (performance.now() - this.perf0) / 1000;
  },
  /** latch onto the audio clock without discontinuity in piece time */
  sync(){
    if (this.audioOffset === null && Audio.ready && Audio.ctx && Audio.ctx.state === 'running'){
      this.audioOffset = Audio.ctx.currentTime - (performance.now() - this.perf0) / 1000;
    }
  },
  /** Let go of the audio clock without a jump in piece time. Safari freezes
      currentTime while a context is 'interrupted'; staying latched to it would
      freeze the visuals too. */
  unsync(){
    if (this.audioOffset !== null){
      const t = this.now();
      this.audioOffset = null;
      this.perf0 = performance.now() - t * 1000;
    }
  },
  /** piece time → AudioContext time, or null when there is no audio to schedule */
  toAudio(t){ return this.audioOffset === null ? null : t + this.audioOffset; },
  /** drop a gap (a backgrounded tab on the fallback clock) instead of catching up */
  rebase(t){ if (this.audioOffset === null) this.perf0 = performance.now() - t * 1000; },
  get onAudio(){ return this.audioOffset !== null; }
};

const visualQueue = [];
const FX = { pulse: 0, bassShock: 0, whiteout: 0, constellation: 0, leviathanQ: 0, sigilQueue: null, silQueue: null };

function stepDur(){ return 60 / M.bpm / 4; }
function barOf(step){ return Math.floor(step / 16); }
function cyclePos(){                                  // 0..1 through the 90s arc
  const b = barOf(M.step) % CYCLE_BARS;
  return (b * 16 + (M.step % 16)) / (CYCLE_BARS * 16);
}

function phaseForBar(bar){
  const b = bar % CYCLE_BARS;
  for (let i = PHASES.length - 1; i >= 0; i--) if (b >= PHASE_START[i]) return i;
  return 0;
}

/** pick the next chord, then voice-lead into it */
function nextChord(){
  const barInCycle = barOf(M.step) % CYCLE_BARS;
  const atPhaseHead = PHASE_START.indexOf(barInCycle) >= 0;
  // every progression resolves home at a phase boundary — the loop has to land
  M.degree = atPhaseHead ? 0 : wpick(PROG[M.degree] || PROG[0]);

  const p = M.phase;
  const mode = (p.name === 'DESCENT' && M.descentDark) ? 'phrygianDom' : p.mode;
  let tmplKey;
  if (p.name === 'SURFACE')      tmplKey = chance(0.5) ? 'maj7s11' : (chance(0.5) ? 'add9' : 'm69');
  else if (p.name === 'DESCENT') tmplKey = chance(0.45) ? 'quartal' : (chance(0.5) ? 'm11' : 'sus4');
  else                           tmplKey = pick(VOICING_KEYS);

  const tmpl = VOICINGS[tmplKey];
  const tones = tmpl.map(o => scalePitch(p.tonic, mode, M.degree + o));
  M.curMode = mode;
  M.voicing = voiceLead(M.voicing, tones, p.lo, p.hi);
  M.tension = TENSE_DEGREES.has(M.degree) ? (M.degree === 1 || chance(0.45) ? 1 : 0) : 0;
  M.chordId++;

  // arp pool: the voicing, plus an octave up, clipped to the phase register
  const pool = [];
  for (const v of M.voicing){
    pool.push(v);
    if (v + 12 <= p.hi) pool.push(v + 12);
    if (v - 12 >= p.lo && chance(0.35)) pool.push(v - 12);
  }
  M.pool = [...new Set(pool)].sort((a,b) => a - b);
  M.patIdx = 0;
  M.walkPos = Math.floor(M.pool.length / 2);
  return { mode, root: scalePitch(p.tonic, mode, M.degree) };
}

/** the arpeggiator's note choice for a given position in the pattern */
function arpNote(){
  const n = M.pool.length;
  if (!n) return 60;
  let idx;
  switch (M.pattern){
    case 'up':    idx = M.patIdx % n; break;
    case 'down':  idx = n - 1 - (M.patIdx % n); break;
    case 'upDown': {
      const period = Math.max(1, n * 2 - 2);
      const k = M.patIdx % period;
      idx = k < n ? k : period - k;
      break;
    }
    case 'downUp': {
      const period = Math.max(1, n * 2 - 2);
      const k = M.patIdx % period;
      idx = k < n ? n - 1 - k : k - n + 1;
      break;
    }
    case 'outsideIn': {
      const k = M.patIdx % n;
      idx = k % 2 === 0 ? Math.floor(k / 2) : n - 1 - Math.floor(k / 2);
      break;
    }
    case 'pedal':
      // top note held as a pedal while the lower voices move beneath it
      idx = (M.patIdx % 2 === 1) ? n - 1 : (Math.floor(M.patIdx / 2) % Math.max(1, n - 1));
      break;
    case 'walk':
    default: {
      // random walk with gravity back toward the centre of the register
      const centre = (n - 1) / 2;
      const drift = (centre - M.walkPos) * 0.28;
      M.walkPos = clamp(Math.round(M.walkPos + drift + (rng() < 0.5 ? -1 : 1) * ri(1, 2)), 0, n - 1);
      idx = M.walkPos;
      break;
    }
  }
  M.patIdx++;
  return M.pool[clamp(idx, 0, n - 1)];
}

/** every sound in the piece goes through here, and so does every photon */
function emit(time, midi, vel, dur, voice){
  if (M.muted) vel = 0;
  const ev = { time, midi, vel, dur, voice, tension: M.tension, chordId: M.chordId, phase: M.phaseIdx };
  const at = Clock.toAudio(time);
  if (vel > 0.002 && at !== null){
    try {
      switch (voice){
        case 'keys':   fmKeys(at, midi, vel, dur, M.phase.bright); break;
        case 'pluck':  ksPluck(at, midi, vel, dur, false); break;
        case 'rpluck': ksPluck(at, midi, vel, dur, true); break;
        case 'sub':    subBass(at, midi, vel, dur); break;
      }
    } catch (e) { noteAudioFailure(e); }
  }
  // The queue MUST stay time-ordered: runs, hook cells and cascades emit notes
  // ahead of the step cursor, so a naive push puts a far-future event at the head
  // and blocks every nearer note behind it. Nearly-sorted, so this is O(1) in practice.
  let i = visualQueue.length;
  while (i > 0 && visualQueue[i-1].time > time) i--;
  visualQueue.splice(i, 0, ev);
}

/* ——— rare events: the reason somebody watches for three minutes ——— */
function maybeRare(bar, time){
  if (bar - M.lastRareBar < 12) return;                 // ≈30s floor
  if (!chance(0.22)) return;
  M.lastRareBar = bar;
  const kind = pick(['leviathan','cascade','constellation','whiteout']);
  showRare(kind);

  if (kind === 'leviathan'){
    M.leviathanUntil = M.step + 16 * 4;
    FX.leviathanQ = 1;
  } else if (kind === 'cascade'){
    const fib = [1,1,2,3,5,8,13,21];
    const note = M.pool.length ? M.pool[Math.floor(M.pool.length * 0.7)] : 72;
    let acc = 0;
    for (let i = 0; i < fib.length; i++){
      acc += fib[i];
      emit(time + acc * stepDur(), note + (i % 2 ? 12 : 0), 0.55 * Math.pow(0.82, i), 0.5, 'pluck');
    }
  } else if (kind === 'constellation'){
    FX.constellation = 1;
    M.voicing.forEach((v, i) => emit(time + i * 0.09, v + 24, 0.10, 2.4, 'pluck'));
  } else if (kind === 'whiteout'){
    M.silenceUntil = M.step + 8;                        // two beats of nothing
    M.bigChordAt   = M.step + 8;
  }
}

/* ——— the step scheduler ——— */
function scheduleStep(){
  const t    = M.nextTime + ((M.step % 2) ? (M.swing - 0.5) * 2 * stepDur() : 0);
  const s16  = M.step % 16;
  const bar  = barOf(M.step);
  const sd   = stepDur();

  // —— bar boundary ——
  if (s16 === 0){
    const pi = phaseForBar(bar);
    if (pi !== M.phaseIdx){
      M.phaseIdx = pi;
      M.phase = PHASES[pi];
      if (pi === 2) M.descentDark = chance(0.5);
      applyPhaseMix(t);
    }
    if (bar % 2 === 0 || chance(0.25)){
      const c = nextChord();
      padTo(c.root - 12, t);
      FX.sigilQueue = { n: Math.max(3, M.voicing.length), tension: M.tension, at: t };
      emit(t, c.root - 12, 0.55 + rng() * 0.2, sd * 16 * (chance(0.4) ? 2 : 1), 'sub');
    }
    if (M.step === 0){
      // a soft roll up the first voicing, so the very first second has something in it
      M.voicing.forEach((v, i) => emit(t + i * 0.055, v, 0.74 - i * 0.045, sd * 9, 'keys'));
      if (M.pool.length) emit(t + 0.30, M.pool[M.pool.length - 1] + 12, 0.42, sd * 10, 'pluck');
    }
    if (bar % 2 === 0) M.pattern = pick(PATTERNS);
    if (bar >= M.nextSilBar){                  // something passes every 40-90s
      M.nextSilBar = bar + ri(16, 36);
      FX.silQueue = 'leviathan';
    }
    maybeRare(bar, t);
  }

  // —— pump on beats 1 and 3 ——
  if (s16 === 0 || s16 === 8) schedulePump(t, M.phaseIdx === 2 ? 0.13 : 0.18);

  const inSilence  = M.step < M.silenceUntil;
  const leviathan  = M.step < M.leviathanUntil;

  // —— the fortissimo chord after the whiteout ——
  if (M.step === M.bigChordAt){
    M.bigChordAt = -1;
    FX.whiteout = 1;
    M.voicing.forEach((v, i) => emit(t + i * 0.012, v, 0.95, 2.6, 'keys'));
    emit(t, M.voicing[0] - 24, 1.0, 3.0, 'sub');
  }
  if (inSilence){ advance(); return; }

  // —— rests: a full beat of silence before roughly every 4th phrase ——
  const phraseIdx = Math.floor(bar / 4);
  const restBeat = (phraseIdx % 4 === 3) && (bar % 4 === 3) && s16 >= 12;
  if (restBeat){ advance(); return; }

  const p = M.phase;

  // —— the hook cell: minor 3rd up, then perfect 4th up. the signature. ——
  if (s16 === 0 && bar % 4 === 0 && chance(0.55) && M.pool.length){
    const base = M.pool[clamp(Math.floor(M.pool.length * rr(0.25, 0.6)), 0, M.pool.length - 1)];
    [[0, 0.92], [3, 0.80], [8, 1.0]].forEach((pair, i) => {
      emit(t + i * sd * 2, base + pair[0], pair[1] * rr(0.72, 0.88), sd * 3.2, 'keys');
    });
    M.patIdx += 3;
    advance(); return;
  }

  // —— the opening leap: a perfect 5th or a major 9th up at the top of a phrase.
  //     open intervals at phrase starts are what make a line sound hopeful. ——
  if (s16 === 0 && bar % 4 === 0 && M.pool.length && chance(0.5)){
    const base = M.pool[clamp(Math.floor(M.pool.length * rr(0.05, 0.40)), 0, M.pool.length - 1)];
    const leap = chance(0.55) ? 7 : 14;
    emit(t, base, rr(0.60, 0.76), sd * 2.6, 'keys');
    emit(t + sd * 2, base + leap, rr(0.80, 0.95), sd * 3.6, 'keys');
    M.patIdx += 2;
    advance(); return;
  }

  // —— 4–3 suspension landing on the downbeat. the oldest trick there is. ——
  if (s16 === 14 && bar % 2 === 0 && chance(0.5) && M.voicing.length){
    const four  = scalePitch(p.tonic, M.curMode, M.degree + 3);
    const three = scalePitch(p.tonic, M.curMode, M.degree + 2);
    const centre = M.voicing[Math.floor(M.voicing.length / 2)];
    let f4 = four;
    while (f4 < centre - 6) f4 += 12;
    while (f4 > centre + 6) f4 -= 12;
    emit(t, f4, rr(0.55, 0.68), sd * 2.4, 'keys');
    emit(t + sd * 2, f4 - (four - three), rr(0.78, 0.92), sd * 5, 'keys');
    M.patIdx++;
    advance(); return;
  }

  // —— the tritone, expanding outward a semitone on each side into a 6th.
  //     reserved for the tension chords, which is where the release is earned. ——
  if (s16 === 8 && M.tension && chance(0.5) && M.voicing.length >= 2){
    const centre = M.voicing[Math.floor(M.voicing.length / 2)];
    const lo = centre - 3, hi = lo + 6;
    emit(t, lo, rr(0.52, 0.64), sd * 2, 'keys');
    emit(t + 0.006, hi, rr(0.54, 0.66), sd * 2, 'keys');
    emit(t + sd * 2, lo - 1, rr(0.74, 0.88), sd * 5, 'keys');
    emit(t + sd * 2 + 0.006, hi + 1, rr(0.76, 0.90), sd * 5, 'keys');
    M.patIdx += 2;
    advance(); return;
  }

  // —— 32nd-note run: two octaves up, landing on a chord tone ——
  if (s16 === 12 && chance(p.runP * 0.35) && M.pool.length > 2){
    const count = ri(6, 11);
    const start = M.pool[0];
    for (let i = 0; i < count; i++){
      const frac = i / (count - 1);
      const target = start + Math.round(frac * 24);
      // snap every note of the run to the chord
      let best = M.pool[0], bd = 99;
      for (const c of M.pool.concat(M.pool.map(x => x + 12))){
        const d = Math.abs(c - target);
        if (d < bd){ bd = d; best = c; }
      }
      emit(t + i * sd * 0.5, best, rr(0.42, 0.62) + frac * 0.3, sd * 1.4, 'keys');
    }
    advance(); return;
  }

  // —— the arpeggio itself ——
  const onBeat   = s16 % 4 === 0;
  const offEighth= s16 % 2 === 0;
  let prob = p.density * (onBeat ? 1.25 : offEighth ? 1.0 : 0.62);
  if (leviathan) prob *= 0.8;
  if (chance(prob)){
    const pos = s16 / 16;
    const contour = 0.70 + 0.34 * Math.sin(pos * Math.PI * 0.92);   // crescendo into beat 3
    const vel = clamp(contour * rr(0.85, 1.15) * (onBeat ? 1.08 : 0.92), 0.08, 1);
    const jitter = rr(-0.008, 0.008);                                // ±8 ms of human
    const midi = arpNote();
    emit(t + jitter, midi, vel * 0.9, sd * rr(1.6, 3.4), leviathan ? 'rpluck' : 'keys');
    // octave-displaced echo: same pitch class, jumped an octave. pure ear candy.
    if (chance(0.10) && midi + 12 <= p.hi) emit(t + jitter + sd * 0.5, midi + 12, vel * 0.4, sd * 2, 'pluck');
  }

  // —— counter-melody: sparse, high, doubled a 5th below ——
  if (s16 % 8 === 0 && chance(p.counter) && M.voicing.length){
    const top = M.voicing[M.voicing.length - 1] + (chance(0.5) ? 12 : 7);
    emit(t + rr(0, 0.02), Math.min(top, p.hi + 6), rr(0.4, 0.6), sd * 6, 'pluck');
    if (chance(0.6)) emit(t + 0.02, Math.min(top, p.hi + 6) - 7, 0.22, sd * 5, 'pluck');
  }

  advance();
}

function advance(){
  M.nextTime += stepDur();
  M.step++;
}

/** phase changes move the mix, not just the notes */
function applyPhaseMix(t){
  const at = Clock.toAudio(t);
  if (!Audio.ready || at === null) return;
  t = at;
  const p = M.phase;
  const k = 0.9;
  Audio.bus.gain.setTargetAtTime(0.9 * p.lvl, t, k);
  Audio.padGain.gain.setTargetAtTime(p.pad, t, k);
  Audio.dWet.gain.setTargetAtTime(p.delay, t, k);
  Audio.vWet.gain.setTargetAtTime(p.verb, t, k);
  Audio.padFilter.frequency.setTargetAtTime(240 + p.bright * 720, t, k);
  Audio.fb.gain.setTargetAtTime(0.30 + p.delay * 0.28, t, k);
}

let schedTimer = null;
function schedulerTick(){
  if (!M.started || M.paused) return;
  try { tickBody(); } catch (e) { noteAudioFailure(e); }
}
function tickBody(){
  const st = Audio.ctx ? Audio.ctx.state : null;
  if (st === 'running') Clock.sync();
  else if (st && !M.paused && !document.hidden){
    Clock.unsync();
    // not every browser fires statechange reliably, so notice it here too
    if (st === SAFARI_INTERRUPTED) noteAudioFailure(new Error(SAFARI_INTERRUPTED));
  }
  // a backgrounded tab on the wall clock opens a gap; skip it rather than
  // scheduling several thousand steps at once
  if (Clock.now() - M.nextTime > 1) Clock.rebase(M.nextTime - 0.05);
  const ahead = Clock.now() + 0.1;
  let guard = 0;
  while (M.nextTime < ahead && guard++ < 80) scheduleStep();
}

/* ——————————————————————————————————————————————————————————————————————————
   VISUALS — a raymarched gorge, and a river that remembers the music.

   There is no keyboard. Every note is a light dropped into the water just in
   front of the camera; the current carries it downstream, so the last half
   minute of playing is always on screen as a glowing wake receding to the
   horizon. Pitch sets which side of the channel it lands on, velocity its
   brightness.

   Two hues and almost nothing between them, taken from the reference: ember
   (15°-30°) in the sky and on anything facing up, electric blue (210°-240°) in
   the water and on anything facing down. Roughly 60% of the frame stays under
   40/255 — the darkness is what makes the light read.
   —————————————————————————————————————————————————————————————————————————— */
const cvs = document.getElementById('stage');
let gl = null, GLFAIL = null;

const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let DPR = 1, ASPECT = 'tall', LOW = false;
const stage = { w: 0, h: 0 };
let lastGradKey = '';                      // kept so the aspect toggle stays a one-liner

/* ——— the river's memory: a circular buffer over distance downstream ——— */
const RIVER_COLS = 256;                    // z resolution
const RIVER_ROWS = 48;                     // across the channel
const RIVER_LEN  = 132.0;                  // world units the buffer spans
const TRANSIT    = 26.0;                   // seconds from the camera to the horizon
const HALF_W     = 2.15;                   // half the channel width, world units
const NL         = 24;                     // near notes promoted to real point lights

const riverCols = [];
for (let i = 0; i < RIVER_COLS; i++) riverCols.push(new Uint8Array(RIVER_ROWS * 4));
let riverHead = 0, riverLastCol = -1, riverDirty = -1;

/* live notes, newest first — these become the point lights */
const live = [];
const lightPos = new Float32Array(NL * 3);
const lightCol = new Float32Array(NL * 4);

const FXV = { ember: 0, flash: 0, sigil: 0, sigilSeed: 0, leviathan: -1, bass: 0, shake: 0 };

/* ——————————————————————————————————————————————————————————————————————————
   SHADERS
   —————————————————————————————————————————————————————————————————————————— */
const VERT = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const SCENE_FRAG = `
precision highp float;
varying vec2 vUv;
uniform vec2  uRes;
uniform float uTime;
uniform float uEmber;        // warm sky swell, 0..1
uniform float uCool;         // how blue the water reads, 0..1
uniform float uRiverHead;
uniform float uLeviathan;    // <0 idle, else 0..1 across the frame
uniform float uSigil;        // rune flare in the sky
uniform float uSigilSeed;
uniform float uBass;
uniform vec3  uCamOff;
uniform sampler2D uRiver;
uniform vec3  uLightPos[${NL}];
uniform vec4  uLightCol[${NL}];

const float RIVER_LEN = ${RIVER_LEN.toFixed(1)};
const float HALF_W    = ${HALF_W.toFixed(2)};
const float BRIDGE_Z  = 62.0;

float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise2(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2(1,0)), f.x),
             mix(hash21(i + vec2(0,1)), hash21(i + vec2(1,1)), f.x), f.y);
}
float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ v += a * noise2(p); p *= 2.03; a *= 0.5; } return v; }

float sdBox(vec3 p, vec3 b){ vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }

/* The gorge: walls stand where |x| exceeds a profile that drifts with z and
   opens out with height. Returns distance to rock for a point in open air. */
float wallX(float z, float y){
  // narrow at the water, opening out above — the walls have to reach into the
  // frame or the whole thing reads as an open plain
  float base = 2.55 + 0.75 * sin(z * 0.045) + 0.42 * sin(z * 0.113 + 2.1);
  base += max(y, 0.0) * 0.92;
  base += 0.85 * fbm(vec2(z * 0.055, max(y, 0.0) * 0.11));
  return base;
}
float mapBridge(vec3 p){
  vec3 q = vec3(p.x, p.y - 3.4, p.z - BRIDGE_Z);
  float deck = sdBox(q, vec3(9.0, 0.62, 0.95));
  float hole = length(vec2(q.x, q.y + 0.62)) - 2.15;
  return max(deck, -hole);
}
float map(vec3 p){ return min(wallX(p.z, p.y) - abs(p.x), mapBridge(p)); }
vec3 mapNormal(vec3 p){
  vec2 e = vec2(0.035, 0.0);
  return normalize(vec3(map(p + e.xyy) - map(p - e.xyy),
                        map(p + e.yxy) - map(p - e.yxy),
                        map(p + e.yyx) - map(p - e.yyx)));
}

/* what the water is carrying at this point */
vec3 riverAt(float z, float x){
  float zi = z / RIVER_LEN;
  if (zi < 0.0 || zi > 1.0) return vec3(0.0);
  float u = fract(uRiverHead - zi);
  float v = clamp(x / (2.0 * HALF_W) + 0.5, 0.0, 1.0);
  vec3 c = texture2D(uRiver, vec2(u, v)).rgb;
  // Fade in just off the camera — the nearest few metres belong to the point
  // lights, which are sharp. Then decay with age so the wake recedes.
  float near = smoothstep(0.0, 0.10, zi);
  return c * c * 3.4 * near * exp(-zi * 1.9);
}

/* the ember sky: dense stars, orange cloud, and a rune when a chord turns */
vec3 sky(vec3 rd){
  vec3 col = vec3(0.004, 0.006, 0.016);
  vec2 sd = rd.xy / max(rd.z, 0.25);
  float up = clamp(rd.y * 2.4 + 0.06, 0.0, 1.0);

  float cloud = fbm(sd * 2.6 + vec2(uTime * 0.006, 0.0));
  cloud = pow(clamp(cloud * 1.9 - 0.70, 0.0, 1.0), 1.9);
  float hot = pow(clamp(fbm(sd * 5.6 - vec2(uTime * 0.011, 0.0)) * 2.1 - 1.02, 0.0, 1.0), 2.0);
  vec3 ember = vec3(1.0, 0.36, 0.07) * cloud * (0.50 + uEmber * 2.8)
             + vec3(1.0, 0.62, 0.22) * hot * (0.35 + uEmber * 5.0);
  col += ember * up;

  vec2 g = floor(sd * 190.0);
  float st = hash21(g);
  if (st > 0.981){
    float tw = 0.55 + 0.45 * sin(uTime * 2.0 + st * 90.0);
    float d = length(fract(sd * 190.0) - 0.5);
    col += vec3(0.85, 0.92, 1.0) * smoothstep(0.42, 0.0, d) * tw * up * 1.5;
  }

  if (uSigil > 0.001){
    vec2 sp = sd - vec2(-0.34 + 0.12 * sin(uSigilSeed), 0.30 + 0.10 * cos(uSigilSeed * 1.7));
    sp *= 9.0;
    float a = atan(sp.y, sp.x), r = length(sp);
    float arms = abs(cos(a * 2.0 + uSigilSeed));
    float rune = smoothstep(0.55, 0.0, abs(r - 0.55 - 0.35 * arms)) * smoothstep(1.6, 0.4, r);
    col += vec3(1.0, 0.45, 0.10) * rune * uSigil * 2.6;
  }
  return col;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  vec3 ro = vec3(uCamOff.x, 2.05 + uCamOff.y, uCamOff.z);
  float sway = 0.035 * sin(uTime * 0.11);
  vec3 rd = normalize(vec3(uv.x * 1.05 + sway, uv.y * 1.05 - 0.155, 1.0));

  // water is an exact plane intersection; only the rock needs marching
  float tW = rd.y < -0.001 ? -ro.y / rd.y : 1e9;
  if (tW > 300.0) tW = 1e9;
  // the channel is bounded by the gorge: beyond the wall line there is no water,
  // and the march finds rock instead. Without this the plane fills the frame.
  if (tW < 1e8){
    vec3 wp = ro + rd * tW;
    if (abs(wp.x) > wallX(wp.z, 0.0) || wp.z < -6.0) tW = 1e9;
  }

  float tR = 1e9, t = 0.15;
  for (int i = 0; i < 78; i++){
    vec3 p = ro + rd * t;
    float d = map(p);
    if (d < 0.02 * t){ tR = t; break; }
    t += max(d * 0.8, 0.05);
    if (t > 175.0) break;
  }

  vec3 col;
  float tHit = min(tW, tR);

  if (tHit > 1e8){
    col = sky(rd);
  } else if (tW < tR){
    /* ——— water ——— */
    vec3 p = ro + rd * tW;
    float flow = uTime * 1.35;
    vec2 q = vec2(p.x, p.z - flow);
    float w1 = fbm(q * 0.75), w2 = fbm(q * 2.6 + 13.0), w3 = noise2(q * 9.0 - 4.0);
    vec3 n = normalize(vec3((w1 - w2) * 0.55, 1.0, (w2 - w3) * 0.55));

    vec3 emis = riverAt(p.z, p.x);
    // Almost nothing of its own. In the reference the water is black except where
    // something is glowing in it — that contrast is the whole image.
    float chan = smoothstep(HALF_W * 1.3, 0.0, abs(p.x));
    vec3 base = vec3(0.002, 0.014, 0.075) * chan * (0.25 + uCool * 0.55);

    // near notes cast real light onto the surface
    vec3 lit = vec3(0.0);
    for (int i = 0; i < ${NL}; i++){
      vec4 lc = uLightCol[i];
      if (lc.a <= 0.001) continue;
      vec3 lp = uLightPos[i];
      float d2 = dot(p.xz - lp.xz, p.xz - lp.xz);
      lit += lc.rgb * lc.a * (1.35 / (1.0 + d2 * 22.0));   // tight, so notes stay separate
    }

    // specular glitter — the reference is full of tiny hard highlights
    // glitter: rare and hard, not a haze. only where there is light to catch.
    float spark = pow(clamp(w3 * 1.9 - 0.88, 0.0, 1.0), 3.0);
    float fres = pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
    float carry = length(emis) + length(lit) * 0.25;

    float edge = smoothstep(0.0, 0.55, HALF_W - abs(p.x));
    col = base + emis * (0.35 + edge * 0.9) + lit * 0.85;
    col += vec3(0.60, 0.82, 1.0) * spark * carry * 2.2;
    // a grazing reflection of an orange sky turns the whole river amber, which
    // kills the two-hue split. Keep a trace, tinted back toward the water.
    col += sky(reflect(rd, n)) * fres * 0.16 * vec3(0.45, 0.75, 1.0);

    if (uLeviathan >= 0.0){
      float lz = mix(8.0, RIVER_LEN * 0.82, uLeviathan);
      float d = length(vec2(p.x * 0.55, (p.z - lz) * 0.10));
      float body = smoothstep(1.0, 0.25, d);
      col *= 1.0 - body * 0.92;
      col += vec3(0.20, 0.45, 1.0) * smoothstep(0.30, 0.0, abs(d - 0.82)) * 0.55;
    }
  } else {
    /* ——— rock ——— */
    vec3 p = ro + rd * tR;
    vec3 n = mapNormal(p);
    float up = n.y * 0.5 + 0.5;

    float mossy = smoothstep(0.35, 0.75, fbm(vec2(p.z * 0.35, p.y * 0.3))) * clamp(n.y, 0.0, 1.0);
    vec3 rock = mix(vec3(0.020, 0.023, 0.028), vec3(0.016, 0.055, 0.028), mossy);
    float grit = 0.55 + 0.9 * fbm(vec2(p.z * 2.1, p.y * 1.8));
    rock *= grit;

    // lit only by what is emitting: sky above, river below
    vec3 warm = vec3(1.0, 0.38, 0.10) * pow(up, 2.1) * (0.14 + uEmber * 1.15);
    float shore = exp(-max(p.y, 0.0) * 0.42) * smoothstep(11.0, 2.0, abs(p.x));
    vec3 cold = vec3(0.10, 0.38, 1.0) * shore * (1.0 - up * 0.55) * (0.5 + uCool);
    cold *= 0.30 + 3.2 * length(riverAt(p.z, clamp(p.x, -HALF_W, HALF_W)));

    col = rock * (warm + cold + vec3(0.012, 0.016, 0.03));
  }

  /* volumetric glow around the newest notes, independent of what was hit */
  for (int i = 0; i < ${NL}; i++){
    vec4 lc = uLightCol[i];
    if (lc.a <= 0.001) continue;
    vec3 toL = uLightPos[i] - ro;
    float tc = dot(toL, rd);
    if (tc <= 0.0 || tc > tHit + 2.0) continue;
    float d2 = dot(toL, toL) - tc * tc;
    col += lc.rgb * lc.a * (0.34 / (1.0 + d2 * 26.0)) * smoothstep(150.0, 3.0, tc);
  }

  /* haze: cold low over the water, ember high */
  float fogT = min(tHit, 175.0);
  float fog = 1.0 - exp(-fogT * 0.0062);
  vec3 fogCol = mix(vec3(0.004, 0.016, 0.055) * (0.4 + uCool * 0.7),
                    vec3(0.075, 0.026, 0.008) * (0.20 + uEmber * 1.2),
                    clamp(rd.y * 2.4 + 0.30, 0.0, 1.0));
  col = mix(col, fogCol, fog * 0.62);

  gl_FragColor = vec4(max(col, 0.0), 1.0);
}`;

const BRIGHT_FRAG = `
precision mediump float;
varying vec2 vUv;
uniform sampler2D uTex;
void main(){
  vec3 c = texture2D(uTex, vUv).rgb;
  float l = dot(c, vec3(0.299, 0.587, 0.114));
  gl_FragColor = vec4(c * smoothstep(0.28, 0.85, l), 1.0);
}`;

const BLUR_FRAG = `
precision mediump float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uDir;
void main(){
  vec3 s = texture2D(uTex, vUv).rgb * 0.227;
  s += (texture2D(uTex, vUv + uDir * 1.385).rgb + texture2D(uTex, vUv - uDir * 1.385).rgb) * 0.316;
  s += (texture2D(uTex, vUv + uDir * 3.231).rgb + texture2D(uTex, vUv - uDir * 3.231).rgb) * 0.070;
  gl_FragColor = vec4(s, 1.0);
}`;

const COMP_FRAG = `
precision mediump float;
varying vec2 vUv;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform vec2  uRes;
uniform float uTime;
uniform float uGrain;
uniform float uFlash;
uniform float uAberr;
float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
void main(){
  vec2 d = (vUv - 0.5);
  vec3 c = texture2D(uScene, vUv).rgb;
  vec3 b = texture2D(uBloom, vUv).rgb;
  if (uAberr > 0.002){
    // channel split scaled by distance from centre, like a real lens
    float a = uAberr * 0.004;
    b.r = texture2D(uBloom, vUv + d * a).r;
    b.b = texture2D(uBloom, vUv - d * a).b;
  }
  c += b * 1.15;
  c += vec3(0.85, 0.93, 1.0) * uFlash;

  // filmic-ish curve, then a cold shadow bias to hold the two-hue palette
  c = c / (c + 0.75);
  c = pow(c, vec3(0.86, 0.90, 0.95));
  c += vec3(-0.004, 0.002, 0.012) * (1.0 - dot(c, vec3(0.33)));

  float vig = smoothstep(1.05, 0.22, length(d * vec2(1.0, 1.25)));
  c *= 0.25 + 0.75 * vig;
  c += (hash21(vUv * uRes + uTime) - 0.5) * uGrain;
  gl_FragColor = vec4(max(c, 0.0), 1.0);
}`;

/* ——————————————————————————————————————————————————————————————————————————
   GL PLUMBING
   —————————————————————————————————————————————————————————————————————————— */
const P = {};                     // compiled programs
const RT = {};                    // render targets
let quad = null, riverTex = null;

function compile(vs, fs){
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]){
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
      throw new Error((type === gl.VERTEX_SHADER ? 'vertex: ' : 'fragment: ') + gl.getShaderInfoLog(sh));
    }
    gl.attachShader(p, sh);
  }
  gl.bindAttribLocation(p, 0, 'aPos');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){
    const info = gl.getActiveUniform(p, i);
    const name = info.name.replace(/\[0\]$/, '');
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}

function makeTarget(w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fb, w, h };
}

function initGL(){
  const opts = { alpha: false, antialias: false, depth: false, stencil: false,
                 powerPreference: 'high-performance', preserveDrawingBuffer: false };
  gl = cvs.getContext('webgl', opts) || cvs.getContext('experimental-webgl', opts);
  if (!gl) throw new Error('WebGL unavailable');

  P.scene = compile(VERT, SCENE_FRAG);
  P.bright = compile(VERT, BRIGHT_FRAG);
  P.blur  = compile(VERT, BLUR_FRAG);
  P.comp  = compile(VERT, COMP_FRAG);

  quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  riverTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, riverTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, RIVER_COLS, RIVER_ROWS, 0, gl.RGBA, gl.UNSIGNED_BYTE,
                new Uint8Array(RIVER_COLS * RIVER_ROWS * 4));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

function drawQuad(){ gl.drawArrays(gl.TRIANGLES, 0, 3); }

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, LOW ? 1 : 2);
  const target = ASPECT === 'tall' ? 9 / 16 : 16 / 9;
  let w = innerWidth, h = Math.round(innerWidth / target);
  if (h > innerHeight){ h = innerHeight; w = Math.round(innerHeight * target); }
  stage.w = w; stage.h = h;
  cvs.style.width = w + 'px';
  cvs.style.height = h + 'px';
  const pw = Math.max(2, Math.round(w * DPR)), ph = Math.max(2, Math.round(h * DPR));
  cvs.width = pw; cvs.height = ph;
  if (!gl) return;

  // the march is the expensive part, so it runs under-resolution and is upscaled
  const s = LOW ? 0.42 : (REDUCED ? 0.5 : 0.62);
  const sw = Math.max(2, Math.round(pw * s)), sh = Math.max(2, Math.round(ph * s));
  const bw = Math.max(2, Math.round(sw * 0.25)), bh = Math.max(2, Math.round(sh * 0.25));
  for (const k of ['scene','bright','blurA','blurB']){
    if (RT[k]){ gl.deleteTexture(RT[k].tex); gl.deleteFramebuffer(RT[k].fb); }
  }
  RT.scene = makeTarget(sw, sh);
  RT.bright = makeTarget(bw, bh);
  RT.blurA = makeTarget(bw, bh);
  RT.blurB = makeTarget(bw, bh);
}

/* ——————————————————————————————————————————————————————————————————————————
   FEEDING THE RIVER
   —————————————————————————————————————————————————————————————————————————— */
function noteColour(midi, tension, phaseIdx){
  // The water is bioluminescent, so notes are electric blue whatever the phase —
  // letting SURFACE turn the river gold collapsed the two-hue opposition that
  // makes the reference work. The sky carries the ember; only tension crosses over.
  const k = clamp((midi - 46) / 44, 0, 1);
  // A tense chord lasts about five seconds, and colouring every one of its notes
  // turned the whole visible river orange. Let it mark roughly a third of them,
  // so ember reads as an accent on blue water rather than replacing it.
  if (tension && midi % 3 === 0) return [1.0, 0.34, 0.10];
  return [0.04 + k * 0.16, 0.26 + k * 0.40, 1.0];
}

function riverColumn(){
  const col = Math.floor(riverHead * RIVER_COLS) % RIVER_COLS;
  if (col !== riverLastCol){
    // clear everything the head has swept past, so a stalled frame leaves no smear
    let c = riverLastCol;
    let guard = 0;
    while (c !== col && guard++ < RIVER_COLS){
      c = (c + 1) % RIVER_COLS;
      riverCols[c].fill(0);
    }
    riverLastCol = col;
  }
  return col;
}

function spawnNote(ev){
  if (ev.vel <= 0.002) return;
  const col = riverColumn();
  const data = riverCols[col];
  const [r, g, b] = noteColour(ev.midi, ev.tension, ev.phase);
  const x = clamp((ev.midi - 64) / 21, -1, 1);
  const centre = (x * 0.85 * 0.5 + 0.5) * (RIVER_ROWS - 1);
  const width = 1.1 + ev.vel * 1.7;
  const amp = Math.min(1, 0.10 + ev.vel * 0.40) * (ev.voice === 'sub' ? 0.6 : 1);

  for (let i = 0; i < RIVER_ROWS; i++){
    const d = (i - centre) / width;
    const f = Math.exp(-d * d) * amp;
    if (f < 0.004) continue;
    const o = i * 4;
    data[o    ] = Math.min(255, data[o    ] + r * f * 255);
    data[o + 1] = Math.min(255, data[o + 1] + g * f * 255);
    data[o + 2] = Math.min(255, data[o + 2] + b * f * 255);
    data[o + 3] = 255;
  }
  riverDirty = col;

  live.unshift({ t0: Clock.now(), x: x * HALF_W * 0.85, vel: ev.vel, r, g, b,
                 sub: ev.voice === 'sub' });
  if (live.length > NL * 3) live.length = NL * 3;

  FXV.bass = Math.max(FXV.bass, ev.voice === 'sub' ? ev.vel : ev.vel * 0.35);
  if (!REDUCED) FXV.shake = Math.max(FXV.shake, ev.voice === 'sub' ? ev.vel * 0.6 : 0);
}

function spawnSigil(n, tension){ FXV.sigil = 1; FXV.sigilSeed = rnd() * 6.28; }
function spawnSilhouette(){ if (FXV.leviathan < 0) FXV.leviathan = 0; }
function spawnConstellation(){ FXV.ember = Math.min(1.6, FXV.ember + 0.5); }
function resetVisuals(){
  live.length = 0;
  for (const c of riverCols) c.fill(0);
  riverDirty = -2;                       // force a full re-upload
  FXV.leviathan = -1; FXV.sigil = 0;
}

/* ——————————————————————————————————————————————————————————————————————————
   RENDER
   —————————————————————————————————————————————————————————————————————————— */
const FLOW = RIVER_LEN / TRANSIT;          // world units per second
let introT = 0, clockT = 0, fps = 60, fpsAcc = 0, fpsN = 0;

function render(dt){
  if (GLFAIL) return;
  clockT += dt;
  if (M.started) introT = Math.min(1, introT + dt / 14);
  const now = Clock.now();

  /* ——— audio and light still land on the same frame: one ordered queue ——— */
  while (visualQueue.length && visualQueue[0].time <= now) spawnNote(visualQueue.shift());
  if (FX.sigilQueue && now >= FX.sigilQueue.at){
    spawnSigil(FX.sigilQueue.n, FX.sigilQueue.tension);
    FX.sigilQueue = null;
  }
  if (FX.leviathanQ){ FX.leviathanQ = 0; spawnSilhouette('leviathan'); }
  if (FX.silQueue){ spawnSilhouette(FX.silQueue); FX.silQueue = null; }
  if (FX.constellation){ FX.constellation = 0; spawnConstellation(); }

  /* ——— phase drives the two hues: ember swells into SURFACE, cools in DESCENT ——— */
  const pi = M.phaseIdx;
  const emberTarget = pi === 3 ? 1.0 : pi === 1 ? 0.50 : pi === 2 ? 0.08 : 0.28;
  const coolTarget  = pi === 2 ? 1.0 : pi === 3 ? 0.35 : 0.70;
  const k = 1 - Math.pow(0.25, dt);
  FXV.ember += (emberTarget - FXV.ember) * k;
  FXV.cool = (FXV.cool === undefined ? coolTarget : FXV.cool + (coolTarget - FXV.cool) * k);
  FXV.flash = FX.whiteout;
  FX.whiteout *= Math.pow(0.02, dt);
  FXV.sigil *= Math.pow(0.06, dt);
  FXV.bass *= Math.pow(0.004, dt);
  FXV.shake *= Math.pow(0.001, dt);
  FX.pulse *= Math.pow(0.015, dt);
  if (FXV.leviathan >= 0){
    FXV.leviathan += dt / 22;
    if (FXV.leviathan > 1) FXV.leviathan = -1;
  }

  /* ——— the river's memory scrolls whether or not notes arrive ——— */
  riverHead = (now / TRANSIT) % 1;
  riverColumn();

  gl.bindTexture(gl.TEXTURE_2D, riverTex);
  if (riverDirty === -2){
    const all = new Uint8Array(RIVER_COLS * RIVER_ROWS * 4);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, RIVER_COLS, RIVER_ROWS, gl.RGBA, gl.UNSIGNED_BYTE, all);
    riverDirty = -1;
  } else {
    // only the column under the write head can have changed
    const col = riverLastCol;
    gl.texSubImage2D(gl.TEXTURE_2D, 0, col, 0, 1, RIVER_ROWS, gl.RGBA, gl.UNSIGNED_BYTE, riverCols[col]);
  }

  /* ——— the newest notes become real lights drifting downstream ——— */
  let n = 0;
  for (let i = 0; i < live.length && n < NL; i++){
    const L = live[i];
    const age = now - L.t0;
    const z = 2.0 + age * FLOW;
    if (z > RIVER_LEN){ live.length = i; break; }
    const fade = Math.exp(-age * 0.62) * (0.22 + L.vel * 0.8);
    if (fade < 0.01) continue;
    lightPos[n * 3    ] = L.x;
    lightPos[n * 3 + 1] = L.sub ? 0.02 : 0.10;
    lightPos[n * 3 + 2] = z;
    lightCol[n * 4    ] = L.r;
    lightCol[n * 4 + 1] = L.g;
    lightCol[n * 4 + 2] = L.b;
    lightCol[n * 4 + 3] = fade;
    n++;
  }
  for (let i = n; i < NL; i++) lightCol[i * 4 + 3] = 0;

  /* ——— pass 1: the scene ——— */
  const S = P.scene;
  gl.bindFramebuffer(gl.FRAMEBUFFER, RT.scene.fb);
  gl.viewport(0, 0, RT.scene.w, RT.scene.h);
  gl.useProgram(S.p);
  const dive = 1 - Math.pow(1 - introT, 3);
  const sh = FXV.shake * 0.05;
  gl.uniform2f(S.u.uRes, RT.scene.w, RT.scene.h);
  gl.uniform1f(S.u.uTime, now);
  gl.uniform1f(S.u.uEmber, FXV.ember * (0.25 + dive * 0.75));
  gl.uniform1f(S.u.uCool, FXV.cool);
  gl.uniform1f(S.u.uRiverHead, riverHead);
  gl.uniform1f(S.u.uLeviathan, FXV.leviathan);
  gl.uniform1f(S.u.uSigil, FXV.sigil);
  gl.uniform1f(S.u.uSigilSeed, FXV.sigilSeed);
  gl.uniform1f(S.u.uBass, FXV.bass);
  gl.uniform3f(S.u.uCamOff,
    Math.sin(now * 0.07) * 0.22 + rr(-sh, sh),
    Math.sin(now * 0.11) * 0.09 + (1 - dive) * 5.5 + rr(-sh, sh),
    (1 - dive) * -6.0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, riverTex);
  gl.uniform1i(S.u.uRiver, 0);
  gl.uniform3fv(S.u.uLightPos, lightPos);
  gl.uniform4fv(S.u.uLightCol, lightCol);
  drawQuad();

  /* ——— pass 2: bloom ——— */
  gl.bindFramebuffer(gl.FRAMEBUFFER, RT.bright.fb);
  gl.viewport(0, 0, RT.bright.w, RT.bright.h);
  gl.useProgram(P.bright.p);
  gl.bindTexture(gl.TEXTURE_2D, RT.scene.tex);
  gl.uniform1i(P.bright.u.uTex, 0);
  drawQuad();

  gl.useProgram(P.blur.p);
  gl.uniform1i(P.blur.u.uTex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, RT.blurA.fb);
  gl.viewport(0, 0, RT.blurA.w, RT.blurA.h);
  gl.bindTexture(gl.TEXTURE_2D, RT.bright.tex);
  gl.uniform2f(P.blur.u.uDir, 1 / RT.bright.w, 0);
  drawQuad();
  gl.bindFramebuffer(gl.FRAMEBUFFER, RT.blurB.fb);
  gl.bindTexture(gl.TEXTURE_2D, RT.blurA.tex);
  gl.uniform2f(P.blur.u.uDir, 0, 1 / RT.blurA.h);
  drawQuad();

  /* ——— pass 3: composite ——— */
  const C = P.comp;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, cvs.width, cvs.height);
  gl.useProgram(C.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, RT.scene.tex);
  gl.uniform1i(C.u.uScene, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, RT.blurB.tex);
  gl.uniform1i(C.u.uBloom, 1);
  gl.activeTexture(gl.TEXTURE0);
  gl.uniform2f(C.u.uRes, cvs.width, cvs.height);
  gl.uniform1f(C.u.uTime, clockT);
  gl.uniform1f(C.u.uGrain, REDUCED ? 0.012 : 0.028);
  gl.uniform1f(C.u.uFlash, FXV.flash * 0.9 + (1 - dive) * 0.0);
  gl.uniform1f(C.u.uAberr, REDUCED ? 0 : FX.pulse * 2.2);
  drawQuad();
}

/* Bring the renderer up, and say so plainly if the machine cannot. */
try {
  initGL();
} catch (e) {
  GLFAIL = String(e.message || e);
}


/* ——————————————————————————————————————————————————————————————————————————
   APP — input, chrome, loop
   —————————————————————————————————————————————————————————————————————————— */
const el = {
  gate:  document.getElementById('gate'),
  ui:    document.getElementById('ui'),
  phase: document.getElementById('phase'),
  meta:  document.getElementById('meta'),
  rare:  document.getElementById('rare'),
  hint:  document.getElementById('hint'),
  keys:  document.getElementById('keys')
};
let rareTimer = null;
function showRare(kind){
  el.rare.textContent = '◈ ' + kind.toUpperCase();
  el.rare.classList.add('on');
  clearTimeout(rareTimer);
  rareTimer = setTimeout(() => el.rare.classList.remove('on'), 4200);
}

let metaAcc = 0;
function updateChrome(dt){
  metaAcc += dt;
  if (metaAcc < 0.25) return;
  metaAcc = 0;
  const bar = barOf(M.step) % CYCLE_BARS;
  el.phase.innerHTML = '<b>' + M.phase.name + '</b><i>' + String(bar + 1).padStart(2,'0') + '/' + CYCLE_BARS + '</i>';
  el.meta.innerHTML =
    'seed ' + SEED + '<br>' +
    M.bpm + ' bpm · ' + Math.round(M.swing * 100) + '% swing<br>' +
    (M.muted ? 'muted' : M.paused ? 'paused' : Math.round(fps) + ' fps') +
    (M.started && !Clock.onAudio ? '<br>silent · visual only' : '');
}

/* ——— Starting audio, on browsers that make it difficult ———
   Safari has a fourth AudioContext state that is not in the Web Audio spec:
   'interrupted'. It appears when WebKit loses the audio session — an incoming
   call, another app or tab taking audio, the screen locking, or the iOS ring/
   silent switch — and while interrupted, currentTime stops advancing entirely.
   resume() alone does not always bring it back; sometimes the context has to be
   thrown away and rebuilt. None of this is reachable from Chromium, which is why
   it took a report from a real browser to find. */

const SAFARI_INTERRUPTED = 'interrupted';

/** Claim the audio session. iOS hands it over only for a buffer played during a gesture. */
function unlockAudioSession(ctx){
  try {
    const b = ctx.createBuffer(1, 1, ctx.sampleRate);
    const src = ctx.createBufferSource();
    src.buffer = b;
    src.connect(ctx.destination);
    src.start(0);
  } catch (e) { /* best effort */ }
}

/** Everything that has to happen once a context is actually running. */
function armAudio(){
  Clock.sync();
  if (!Clock.onAudio) return false;
  setDelayTime(M.bpm);
  applyPhaseMix(Math.max(M.nextTime, Clock.now()));
  const t = Audio.ctx.currentTime;
  Audio.master.gain.cancelScheduledValues(t);
  // An exponential ramp spends nearly all its time near the bottom: from 0.0001
  // it is still at 1% of target halfway through. Start audible, get out of the way.
  Audio.master.gain.setValueAtTime(M.muted ? 0.0001 : 0.12, t);
  if (!M.muted) Audio.master.gain.exponentialRampToValueAtTime(1.0, t + 2);
  Audio.padGain.gain.setTargetAtTime(M.phase.pad, t, 1.2);
  clearAudioFailure();
  return true;
}

/** Watch for the session coming back on its own, and for losing it mid-piece. */
function watchContext(ctx){
  ctx.onstatechange = () => {
    const st = ctx.state;
    if (st === 'running') armAudio();
    else if (st === SAFARI_INTERRUPTED || st === 'suspended'){
      if (!M.paused && !document.hidden){
        Clock.unsync();
        if (st === SAFARI_INTERRUPTED) noteAudioFailure(new Error(SAFARI_INTERRUPTED));
      }
    }
  };
}

/** Build the graph and try to get it running. Used for the first start and every retry. */
function initAudio(){
  try {
    buildAudio();
    watchContext(Audio.ctx);
    unlockAudioSession(Audio.ctx);
    if (Audio.ctx.state === 'running'){ armAudio(); return; }
    Audio.ctx.resume().then(() => {
      if (Audio.ctx.state === 'running') armAudio();
      else noteAudioFailure(new Error('context ' + Audio.ctx.state));
    }).catch(e => noteAudioFailure(e));
  } catch (e) {
    noteAudioFailure(e);
  }
}

/** A context stuck in 'interrupted' sometimes only recovers by being replaced.
    Capped: browsers limit how many contexts a page may create, and on a device
    where the session is simply unavailable, retrying forever would exhaust them. */
let rebuilds = 0;
const MAX_REBUILDS = 3;
function rebuildAudio(){
  if (rebuilds >= MAX_REBUILDS) return;
  rebuilds++;
  Clock.unsync();
  const old = Audio.ctx;
  Audio.ready = false;
  Audio.ctx = null;
  if (old){ try { old.onstatechange = null; old.close(); } catch (e) {} }
  initAudio();
}

function start(){
  if (M.started) return;
  M.started = true;
  Clock.begin();
  M.nextTime = 0.15;

  // Audio is an enhancement, not a prerequisite. If none of this works the piece
  // still runs — silently, and saying so — instead of going dark.
  initAudio();

  schedTimer = setInterval(schedulerTick, 25);
  el.gate.classList.add('gone');
  setTimeout(() => { el.gate.style.display = 'none'; }, 1700);
  setTimeout(() => {
    if (!Clock.onAudio && !M.audioError){
      noteAudioFailure(new Error('context ' + (Audio.ctx ? Audio.ctx.state : 'unavailable')));
    }
  }, 900);
}

/** Say what went wrong, on screen, instead of failing silently.
    This runs inside catch blocks, so it must not be able to throw itself. */
function noteAudioFailure(err){
  try {
    const msg = String((err && err.message) || err || 'unknown');
    if (M.audioError === msg) return;
    M.audioError = msg;
    if (!el || !el.hint) return;
    el.hint.innerHTML = msg === SAFARI_INTERRUPTED
      ? 'safari lost the audio session<br>tap to retry &nbsp;·&nbsp; check the silent switch'
      : 'no audio: ' + msg.slice(0, 42) + '<br>tap to retry &nbsp;·&nbsp; ? keys';
  } catch (e) { /* reporting must never break playback */ }
}

function clearAudioFailure(){
  try {
    if (!M.audioError) return;
    M.audioError = null;
    if (el && el.hint) el.hint.innerHTML = '? keys';
  } catch (e) {}
}

function reseed(){
  SEED = (Math.random() * 0xFFFFFF | 0).toString(36).toUpperCase().padStart(4,'0');
  rng = mulberry32(seedFromString(SEED));
  try {
    const u = new URL(location.href); u.searchParams.set('seed', SEED);
    history.replaceState(null, '', u);
  } catch (e) { /* sandboxed frame — the seed is still shown in the corner */ }
  M.voicing = []; M.pool = []; M.degree = 0; M.walkPos = 0;
  visualQueue.length = 0;
  resetVisuals();
  M.nextTime = Math.max(M.nextTime, Clock.now() + 0.05);
}

function jumpToPhase(i){
  if (!M.started) return;
  const bar = barOf(M.step);
  const cyc = Math.floor(bar / CYCLE_BARS);
  // always jump forward — landing behind the cursor would replay the same bars
  let target = cyc * CYCLE_BARS + PHASE_START[i];
  if (target <= bar) target += CYCLE_BARS;
  M.step = target * 16;
  M.phaseIdx = i; M.phase = PHASES[i];
  M.nextTime = Clock.now() + 0.05;
  applyPhaseMix(M.nextTime);
}

function setPaused(p){
  M.paused = p;
  if (!Audio.ready || !Audio.ctx) return;
  if (p) Audio.ctx.suspend().catch(() => {});
  else Audio.ctx.resume().then(() => {
    Clock.sync();
    M.nextTime = Math.max(M.nextTime, Clock.now() + 0.08);
  }).catch(() => {});
}

/** Every pointer press is a fresh chance at the audio session. */
let retryAt = 0;
function retryAudio(){
  if (!M.started || M.paused) return;
  const now = performance.now();
  if (now - retryAt < 400) return;
  retryAt = now;
  if (!Audio.ctx){ initAudio(); return; }
  const st = Audio.ctx.state;
  if (st === 'running'){ armAudio(); return; }
  Audio.ctx.resume().then(() => {
    if (Audio.ctx.state === 'running') armAudio();
    else if (Audio.ctx.state === SAFARI_INTERRUPTED) rebuildAudio();  // resume wasn't enough
  }).catch(() => rebuildAudio());
}
addEventListener('pointerdown', retryAudio);
addEventListener('touchend', retryAudio);

el.gate.addEventListener('click', start);
el.gate.addEventListener('touchstart', e => { e.preventDefault(); start(); }, { passive:false });

addEventListener('keydown', e => {
  const k = e.key;
  if (k === ' '){ e.preventDefault(); if (!M.started) return start(); setPaused(!M.paused); }
  else if (k === 'm' || k === 'M'){
    M.muted = !M.muted;
    if (Audio.ready) Audio.master.gain.setTargetAtTime(M.muted ? 0.0001 : 1.0, Audio.ctx.currentTime, 0.12);
    Clock.sync();
  }
  else if (k === 'r' || k === 'R') reseed();
  else if (k >= '1' && k <= '4') jumpToPhase(+k - 1);
  else if (k === 'ArrowLeft')  { M.bpm = clamp(M.bpm - 4, 72, 132); setDelayTime(M.bpm); }
  else if (k === 'ArrowRight') { M.bpm = clamp(M.bpm + 4, 72, 132); setDelayTime(M.bpm); }
  else if (k === 'v' || k === 'V'){ ASPECT = ASPECT === 'wide' ? 'tall' : 'wide'; lastGradKey = ''; resize(); }
  else if (k === 'f' || k === 'F'){
    if (!document.fullscreenElement) (document.documentElement.requestFullscreen || (()=>{})).call(document.documentElement);
    else if (document.exitFullscreen) document.exitFullscreen();
  }
  else if (k === 'h' || k === 'H') el.ui.classList.toggle('hidden');
  else if (k === '?' || k === '/') el.keys.classList.toggle('on');
  else if (k === 'Escape') el.keys.classList.remove('on');
});
el.keys.addEventListener('click', () => el.keys.classList.remove('on'));

addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));

document.addEventListener('visibilitychange', () => {
  if (!Audio.ready) return;
  if (document.hidden) Audio.ctx.suspend();
  else if (!M.paused) Audio.ctx.resume().then(() => {
    Clock.sync();
    M.nextTime = Math.max(M.nextTime, Clock.now() + 0.1);
  }).catch(() => {});
});

/* ——— main loop ——— */
let last = performance.now(), lowStreak = 0;
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5){ fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0;
    // hysteresis, and it has to be able to climb back out — a single hitch used
    // to latch the scene into reduced fidelity for the rest of the run
    if (fps < 44){ lowStreak = Math.max(1, lowStreak + 1); if (lowStreak > 3 && !LOW){ LOW = true; resize(); } }
    else if (fps > 56){ lowStreak = Math.min(-1, lowStreak - 1); if (lowStreak < -8 && LOW){ LOW = false; resize(); } }
    else lowStreak = 0;
  }
  render(M.paused ? 0 : dt);
  updateChrome(dt);
  requestAnimationFrame(frame);
}

resize();
if (GLFAIL){
  el.hint.innerHTML = 'no 3d: ' + GLFAIL.slice(0, 44) + '<br>? keys';
  el.phase.innerHTML = '<b>AUDIO ONLY</b>';
}
requestAnimationFrame(frame);
</script>
</body>
</html>
