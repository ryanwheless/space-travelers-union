<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lucy's Way</title>
</head>
<body>
<style>
  html,body{height:100%;}
  body{margin:0;overflow:hidden;background:#6d97bf;touch-action:none;
    -webkit-user-select:none;user-select:none;}
  #game{position:fixed;inset:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

  #title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;opacity:1;transition:opacity 1.6s ease;}
  #title.gone{opacity:0;}
  #title h1{font-family:Georgia,'Times New Roman',serif;font-weight:normal;
    font-size:clamp(34px,7vw,64px);letter-spacing:.32em;text-indent:.32em;
    color:#f7efdd;margin:0 0 14vh;
    text-shadow:0 1px 2px rgba(35,25,12,.45),0 6px 28px rgba(35,25,12,.5);}

  #win{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 45%,rgba(35,26,14,.28),rgba(35,26,14,.66));
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity 1.2s ease,visibility 0s 1.2s;}
  #win.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity 1.2s ease;}
  #win .inner{text-align:center;padding:20px;}
  #win h2{font-family:Georgia,'Times New Roman',serif;font-weight:normal;
    font-size:clamp(44px,10vw,92px);letter-spacing:.14em;text-indent:.14em;
    color:#f7efdd;margin:0 0 10px;
    text-shadow:0 1px 2px rgba(35,25,12,.5),0 8px 34px rgba(35,25,12,.55);}
  #win .sniff{font-family:Georgia,serif;font-style:italic;
    font-size:clamp(15px,3vw,20px);color:#e9dfc8;margin:0 0 40px;letter-spacing:.08em;}
  #win button{font-family:Georgia,serif;font-size:16px;letter-spacing:.26em;text-indent:.26em;
    text-transform:lowercase;color:#f7efdd;background:transparent;
    border:1px solid rgba(247,239,221,.55);border-radius:2px;
    padding:13px 34px 12px;cursor:pointer;transition:background .25s,border-color .25s;}
  #win button:hover{background:rgba(247,239,221,.12);border-color:#f7efdd;}
  #win button:focus-visible{outline:2px solid #f7efdd;outline-offset:4px;}
</style>

<div id="game">
  <canvas id="c"></canvas>
  <div id="title"><h1>Lucy&rsquo;s Way</h1></div>
  <div id="win">
    <div class="inner">
      <h2>You win!</h2>
      <p class="sniff">*sniff&hellip; sniff&hellip;*</p>
      <button id="againBtn">again</button>
    </div>
  </div>
</div>

// ---- input ----
var keys={}, stick=null;              // stick: {ox,oy,dx,dy}
window.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(e.key.toLowerCase())>=0)e.preventDefault();
  keys[k]=true;
});
window.addEventListener('keyup',function(e){delete keys[e.key.toLowerCase()];});
window.addEventListener('blur',function(){keys={};stick=null;});
window.addEventListener('contextmenu',function(e){e.preventDefault();});
cvs.addEventListener('pointerdown',function(e){
  e.preventDefault();
  stick={ox:e.clientX,oy:e.clientY,dx:0,dy:0};
  cvs.setPointerCapture(e.pointerId);
});
cvs.addEventListener('pointermove',function(e){
  if(stick){stick.dx=e.clientX-stick.ox;stick.dy=e.clientY-stick.oy;}
});
function endStick(){stick=null;}
cvs.addEventListener('pointerup',endStick);
cvs.addEventListener('pointercancel',endStick);

function inputVec(){
  var fwd=0,str=0;
  if(keys['w']||keys['arrowup'])fwd+=1;
  if(keys['s']||keys['arrowdown'])fwd-=1;
  if(keys['a']||keys['arrowleft'])str-=1;
  if(keys['d']||keys['arrowright'])str+=1;
  if(stick){
    var f=-stick.dy/70, t=stick.dx/80;
    // press-and-hold with no drag still trots forward
    if(Math.abs(f)<.12&&Math.abs(t)<.12)f=.55;
    fwd+=Math.max(-1,Math.min(1,f));
    str+=Math.max(-1,Math.min(1,t));
  }
  return {f:Math.max(-1,Math.min(1,fwd)), s:Math.max(-1,Math.min(1,str))};
}

var imgB=new Image(), imgD=new Image(), imgF=new Image();
var loaded=0, dirtData=null, furTile=null;
var PANO_CENTER=512;                 // pano px that faces heading 0 (photo's own center)
function onload(){ if(++loaded===3) init(); }
imgB.onload=onload; imgD.onload=onload; imgF.onload=onload;
imgB.src=BACKDROP; imgD.src=DIRT; imgF.src=FUR;

function init(){
  var dc=document.createElement('canvas'); dc.width=DS; dc.height=DS;
  var dctx=dc.getContext('2d'); dctx.drawImage(imgD,0,0,DS,DS);
  dirtData=dctx.getImageData(0,0,DS,DS).data;

  fc.drawImage(imgF,0,0);
  fc.save(); fc.translate(imgF.width*2,0); fc.scale(-1,1); fc.drawImage(imgF,0,0); fc.restore();
  fc.save(); fc.translate(0,imgF.height*2); fc.scale(1,-1); fc.drawImage(imgF,0,0); fc.restore();
  fc.save(); fc.translate(imgF.width*2,imgF.height*2); fc.scale(-1,-1); fc.drawImage(imgF,0,0); fc.restore();
  sampleHaze();
  resize();
  requestAnimationFrame(frame);
}

// ---- low-res ground buffer ----
var g=document.createElement('canvas'), gctx=g.getContext('2d'), gImg=null;
var grainCan=null, snoutCan=null;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cvs.width=W*DPR; cvs.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  horizon=Math.round(H*.54); cx=W/2;
  focal=(W/2)/Math.tan(HFOV/2);
  g.width=Math.min(440,W); g.height=Math.max(80,Math.round(g.width*(H-horizon)/W));
  gImg=gctx.createImageData(g.width,g.height);
  buildGrain(); buildSnout();
}
window.addEventListener('resize',resize);

function buildGrain(){
  grainCan=document.createElement('canvas'); grainCan.width=180; grainCan.height=180;
  var c=grainCan.getContext('2d'), img=c.createImageData(180,180);
  for(var i=0;i<img.data.length;i+=4){
    var v=190+Math.random()*65;
    img.data[i]=img.data[i+1]=img.data[i+2]=v;
    img.data[i+3]=Math.random()*22;
  }
  c.putImageData(img,0,0);
}

// ---- photographic snout sprite ----
function buildSnout(){
  var sw=Math.round(W*.72), sh=Math.round(H*.30), ch=Math.round(sh*1.25);
  snoutCan=document.createElement('canvas'); snoutCan.width=sw; snoutCan.height=ch;
  snoutCan._curveH=sh;
  var c=snoutCan.getContext('2d');
  var pat=c.createPattern(furTile,'repeat');
  var mx=sw/2, sn=sh;
  c.save();
  c.beginPath();
  c.moveTo(0,ch);
  c.bezierCurveTo(mx*.28,sn*.30, mx*.62,sn*.02, mx,sn*.02);
  c.bezierCurveTo(mx*1.38,sn*.02, mx*1.72,sn*.30, sw,ch);
  c.closePath();
  c.clip();
  // offset + slight rotation so the mirrored fur tile's symmetry axis
  // never aligns with the snout's own center line
  c.save(); c.translate(-140,-60); c.rotate(.21); c.scale(1.7,1.7);
  c.fillStyle=pat; c.fillRect(-160,-160,sw+460,ch+460); c.restore();
  // warm light from the right, shade on the left — like the photo
  var lg=c.createLinearGradient(0,0,sw,0);
  lg.addColorStop(0,'rgba(90,66,40,.30)'); lg.addColorStop(.45,'rgba(90,66,40,0)');
  lg.addColorStop(.8,'rgba(255,226,170,.14)');
  c.fillStyle=lg; c.fillRect(0,0,sw,ch);
  var tg=c.createLinearGradient(0,0,0,ch);
  tg.addColorStop(0,'rgba(255,244,220,.20)'); tg.addColorStop(.5,'rgba(0,0,0,0)');
  tg.addColorStop(1,'rgba(70,50,30,.25)');
  c.fillStyle=tg; c.fillRect(0,0,sw,ch);
  c.restore();
  // scruffy wisps along the silhouette
  c.strokeStyle='rgba(238,225,196,.35)'; c.lineCap='round';
  for(var i=0;i<32;i++){
    var t=i/45, px=t*sw;
    var edgeY=snoutEdgeY(px,sw,sh);
    var len=sh*(.05+((i*7919)%7)*.012), lw=1+((i*104729)%3);
    c.lineWidth=lw*.7;
    c.beginPath(); c.moveTo(px,edgeY+2);
    c.lineTo(px+((i%2)?3:-3), edgeY-len); c.stroke();
  }
}
function snoutEdgeY(px,sw,sh){
  var t=Math.abs(px-sw/2)/(sw/2);
  return sh*.02 + Math.pow(t,1.7)*sh*.98;
}

// ---- ground (mode-7 over the photo's dirt) ----
var HAZE=[186,152,116];   // replaced at init with the pano's real base tone
function sampleHaze(){
  var c=document.createElement('canvas'); c.width=64; c.height=4;
  var cc=c.getContext('2d');
  cc.drawImage(imgB,0,imgB.height-8,imgB.width,8,0,0,64,4);
  var d=cc.getImageData(0,0,64,4).data, r=0,g=0,b=0,n=64*4;
  for(var i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];}
  HAZE=[r/n,g/n,b/n];
}
function renderGround(bobPx){
  var gw=g.width, gh=g.height, data=gImg.data;
  var f=(gw/2)/Math.tan(HFOV/2);
  var sinH=Math.sin(heading), cosH=Math.cos(heading);
  var dirX=sinH, dirZ=cosH, rightX=cosH, rightZ=-sinH;
  var texScale=DS/2.6;                       // 2.6 world units per tile
  var fY=f*(W/gw)*(gh/(H-horizon));          // vertical focal in low-res rows
  var p=0;
  for(var y=0;y<gh;y++){
    var yy=y+1;
    var d=CAMH*fY/yy;                        // screen row -> ground distance
    var hz=Math.min(1, d/26);
    var wxBase=camX+dirX*d, wzBase=camZ+dirZ*d;
    var lat0=(-gw/2)/f*d, dlat=d/f;
    var wx=wxBase+rightX*lat0, wz=wzBase+rightZ*lat0;
    var stepX=rightX*dlat, stepZ=rightZ*dlat;
    for(var x=0;x<gw;x++){
      var u=((wx*texScale)%DS+DS)%DS|0;
      var v=((wz*texScale)%DS+DS)%DS|0;
      var q=(v*DS+u)*4;
      var r=dirtData[q],gr=dirtData[q+1],b=dirtData[q+2];
      if(hz>0){
        r=r+(HAZE[0]-r)*hz*.85; gr=gr+(HAZE[1]-gr)*hz*.85; b=b+(HAZE[2]-b)*hz*.85;
      }
      data[p]=r; data[p+1]=gr; data[p+2]=b; data[p+3]=255;
      p+=4;
      wx+=stepX; wz+=stepZ;
    }
  }
  gctx.putImageData(gImg,0,0);
}

// ---- flower ----
function projFlower(){
  var relX=FLOWER.x-camX, relZ=FLOWER.z-camZ;
  var sinH=Math.sin(heading), cosH=Math.cos(heading);
  var fz=relX*sinH+relZ*cosH;
  var fx=relX*cosH-relZ*sinH;
  return {fz:fz,fx:fx,dist:Math.sqrt(relX*relX+relZ*relZ)};
}
function drawFlower(t,bobPx){
  var pr=projFlower();
  if(pr.fz<0.5)return null;
  var sc=focal/pr.fz;
  var sx=cx+pr.fx/pr.fz*focal;
  var syBase=horizon+bobPx+CAMH*sc;
  var hRad=Math.min(sc*.055, H*.16);
  var stemH=sc*.42;
  if(syBase-stemH<horizon-8) stemH=syBase-(horizon-8);
  var hx=sx+(reduced?0:Math.sin(t*.0014)*hRad*.15), hy=syBase-stemH;
  if(hRad<2.4){
    ctx.fillStyle='rgba(255,205,80,.9)';
    ctx.beginPath();ctx.arc(sx,syBase-Math.max(stemH,3),Math.max(hRad,1.6),0,Math.PI*2);ctx.fill();
    return {x:sx,y:syBase-stemH,r:hRad};
  }
  if(syBase<H+30){
    // contact shadow + stem + leaves only while the base is on screen
    var sh=ctx.createRadialGradient(sx+hRad*.4,syBase,0,sx+hRad*.4,syBase,hRad*2.2);
    sh.addColorStop(0,'rgba(60,40,20,.34)'); sh.addColorStop(1,'rgba(60,40,20,0)');
    ctx.fillStyle=sh;
    ctx.beginPath();ctx.ellipse(sx+hRad*.4,syBase,hRad*2.2,hRad*.6,0,0,Math.PI*2);ctx.fill();
    var sg=ctx.createLinearGradient(sx,syBase,hx,hy);
    sg.addColorStop(0,'#4a5e26'); sg.addColorStop(1,'#71893a');
    ctx.strokeStyle=sg; ctx.lineWidth=Math.max(1.5,hRad*.16); ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(sx,syBase);
    ctx.quadraticCurveTo(sx+hRad*.5,syBase-stemH*.55,hx,hy+hRad*.5);
    ctx.stroke();
    ctx.fillStyle='#5d7530';
    ctx.beginPath();ctx.ellipse(sx+hRad*.85,syBase-stemH*.38,hRad*.9,hRad*.28,-.45,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#526a2a';
    ctx.beginPath();ctx.ellipse(sx-hRad*.7,syBase-stemH*.6,hRad*.75,hRad*.24,.55,0,Math.PI*2);ctx.fill();
  }
  // petals: back ring darker + front ring lit, length jitter, warm rim from the right
  var a,ang,jl,pxx,pyy,pg;
  for(a=0;a<11;a++){
    ang=a/11*Math.PI*2+.13; jl=.9+((a*2654435761)%7)*.03;
    pxx=hx+Math.cos(ang)*hRad*1.02*jl; pyy=hy+Math.sin(ang)*hRad*1.02*jl;
    ctx.fillStyle=Math.cos(ang)>0?'#c8932a':'#b07f22';
    ctx.beginPath();
    ctx.ellipse(pxx,pyy,hRad*.60*jl,hRad*.27,ang,0,Math.PI*2);
    ctx.fill();
  }
  for(a=0;a<9;a++){
    ang=a/9*Math.PI*2+.42; jl=.88+((a*40503)%6)*.035;
    pxx=hx+Math.cos(ang)*hRad*.88*jl; pyy=hy+Math.sin(ang)*hRad*.88*jl;
    pg=ctx.createLinearGradient(hx,hy,pxx,pyy);
    pg.addColorStop(0,'#d9a22a');
    pg.addColorStop(1, Math.cos(ang)>0 ? '#ffe083':'#f2c34a');
    ctx.fillStyle=pg;
    ctx.beginPath();
    ctx.ellipse(pxx,pyy,hRad*.58*jl,hRad*.30,ang,0,Math.PI*2);
    ctx.fill();
    // petal vein
    ctx.strokeStyle='rgba(160,110,30,.35)'; ctx.lineWidth=Math.max(.6,hRad*.02);
    ctx.beginPath();ctx.moveTo(hx+Math.cos(ang)*hRad*.42,hy+Math.sin(ang)*hRad*.42);
    ctx.lineTo(hx+Math.cos(ang)*hRad*1.18*jl,hy+Math.sin(ang)*hRad*1.18*jl);ctx.stroke();
  }
  var cg=ctx.createRadialGradient(hx-hRad*.15,hy-hRad*.15,0,hx,hy,hRad*.55);
  cg.addColorStop(0,'#8a5c26'); cg.addColorStop(1,'#54350f');
  ctx.fillStyle=cg;
  ctx.beginPath();ctx.arc(hx,hy,hRad*.48,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(40,24,8,.55)';
  for(a=0;a<10;a++){
    var da=a*2.39, dr=hRad*.32*Math.sqrt(a/10);
    ctx.beginPath();ctx.arc(hx+Math.cos(da)*dr,hy+Math.sin(da)*dr,hRad*.045,0,Math.PI*2);ctx.fill();
  }
  // soft warm rim light, low right — matches the photo's sun
  var rim=ctx.createRadialGradient(hx+hRad*.9,hy+hRad*.4,hRad*.2,hx,hy,hRad*1.6);
  rim.addColorStop(0,'rgba(255,232,170,.20)'); rim.addColorStop(1,'rgba(255,232,170,0)');
  ctx.fillStyle=rim;
  ctx.beginPath();ctx.arc(hx,hy,hRad*1.6,0,Math.PI*2);ctx.fill();
  return {x:hx,y:hy,r:hRad};
}

// ---- scent ----
var scents=[];
function drawScents(dt,f){
  if(f&&(state==='sniff')&&!reduced&&Math.random()<.4)
    scents.push({x:f.x+(Math.random()*2-1)*f.r,y:f.y-f.r*.5,t:0,w:5+Math.random()*8,dur:1+Math.random()*.5});
  for(var i=scents.length-1;i>=0;i--){
    var s=scents[i]; s.t+=dt;
    var k=s.t/s.dur;
    if(k>=1){scents.splice(i,1);continue;}
    ctx.strokeStyle='rgba(255,252,240,'+((1-k)*.4).toFixed(3)+')';
    ctx.lineWidth=1.6;
    ctx.beginPath();
    var y0=s.y-k*H*.13;
    for(var j=0;j<=9;j++){
      var yy=y0-j*4, xx=s.x+Math.sin(j*.9+s.t*5)*s.w*(1-k*.4);
      j?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);
    }
    ctx.stroke();
  }
}

// ---- backdrop ----
function drawBackdrop(bobPx,swayPx){
  // cylindrical pano built from the photo; heading 0 centers the photo's own framing
  var T=imgB.width;
  var ppr=T/(2*Math.PI);                // pano px per radian
  var sx=(W/HFOV)/ppr;                  // screen px per pano px
  var drawW=T*sx;
  var px0=(heading*ppr+PANO_CENTER)%T; if(px0<0)px0+=T;
  var drawnH=Math.max(horizon+Math.abs(bobPx)+2, sx*imgB.height);
  var xLeft=cx-px0*sx+swayPx;
  for(var k=-1;k<=1;k++){
    var x=xLeft+k*drawW;
    if(x>W||x+drawW<0)continue;
    ctx.drawImage(imgB, x, horizon+bobPx-drawnH, drawW+1, drawnH);
  }
}

// ---- main loop ----
var last=performance.now();
function frame(now){
  var dt=Math.min((now-last)/1000,.05); last=now;
  var iv=(state==='title'||state==='roam')?inputVec():{f:0,t:0};

  if((iv.f||iv.s)&&!moved&&state==='title'){
    moved=true; state='roam';
    titleEl.classList.add('gone');
  }
  if(state==='roam'||state==='title'){
    var vz=(iv.f>=0?iv.f*SPEED:iv.f*BACK);
    var vx=iv.s*STRAFE;
    var mag=Math.sqrt(vx*vx+vz*vz), cap=Math.max(Math.abs(vz),Math.abs(vx),.001);
    if(mag>cap){vx*=cap/mag; vz*=cap/mag;}       // diagonals don't speed up
    var sp=Math.sqrt(vx*vx+vz*vz)*(iv.f<0&&!iv.s?-1:1);
    var nx=camX+vx*dt;
    var nz=camZ+vz*dt;
    var ddx=nx-ROAM_C.x, ddz=nz-ROAM_C.z;
    var dc=Math.sqrt(ddx*ddx+ddz*ddz);
    if(dc>ROAM_R){                     // soft edge: resistance, then stop
      var over=(dc-ROAM_R)/4;
      var damp=Math.max(0,1-over);
      nx=camX+(nx-camX)*damp; nz=camZ+(nz-camZ)*damp;
    }
    camX=nx; camZ=nz;
    speedNorm+= (Math.abs(sp)/SPEED-speedNorm)*Math.min(1,dt*8);
    if(Math.abs(sp)>.1) phase+=dt*7*(Math.abs(sp)/SPEED);
    heading=Math.sin(phase*.5)*.012*speedNorm;   // organic yaw sway while trotting
    var pr=projFlower();
    if(state==='roam'&&pr.dist<=SNIFF_D){ state='sniff'; sniffT=0; }
  }
  if(state==='sniff'){
    sniffT+=dt;
    // glide the nose right up to the bloom, settling back to the photo's framing
    var tx=FLOWER.x, tz=FLOWER.z-0.55;
    var k=Math.min(1,dt*2.4);
    camX+=(tx-camX)*k; camZ+=(tz-camZ)*k;
    heading+= (0-heading)*k;
    speedNorm*= (1-Math.min(1,dt*4));
    if(sniffT>2.1){ state='won'; winEl.classList.add('show'); }
  }

  var bobAmp=reduced?H*.003:H*.010;
  var bobPx=Math.sin(phase*2)*bobAmp*speedNorm;
  var swayPx=Math.sin(phase)*W*.004*speedNorm;

  ctx.clearRect(0,0,W,H);
  drawBackdrop(bobPx,swayPx);
  renderGround(bobPx);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(g,0,horizon+bobPx,W,H-horizon+Math.abs(bobPx)+2);
  var f=drawFlower(now,bobPx);
  drawScents(dt,f);

  // snout (canvas is taller than the curve so lifting never exposes a gap)
  var lift=(state==='sniff'||state==='won')?Math.min(1,sniffT/1.2)*H*.05:0;
  var wob=(state==='sniff'&&!reduced)?Math.sin(now*.05)*2.5:0;
  ctx.drawImage(snoutCan, cx-snoutCan.width/2+wob-swayPx*.5,
    H-snoutCan._curveH*.96 - bobPx*.7 - lift);
  drawNose(now,bobPx,lift,wob,swayPx);

  // grade: grain + vignette
  var v=ctx.createRadialGradient(cx,H*.5,H*.38,cx,H*.5,H*1.0);
  v.addColorStop(0,'rgba(28,20,10,0)'); v.addColorStop(1,'rgba(28,20,10,.30)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  var ox=reduced?0:(now*.05)%180, oy=reduced?0:(now*.083)%180;
  ctx.globalAlpha=.55;
  for(var x=-ox;x<W;x+=180)for(var y=-oy;y<H;y+=180)ctx.drawImage(grainCan,x,y);
  ctx.globalAlpha=1;

  requestAnimationFrame(frame);
}

function drawNose(t,bobPx,lift,wob,swayPx){
  var sn=snoutCan._curveH;
  var nx=cx+wob-swayPx*.5;
  var ny=H-sn*.96-bobPx*.7-lift+sn*.10;
  var nw=sn*.34;
  var flare=(state==='sniff'&&!reduced)?1+Math.abs(Math.sin(t*.02))*.09:1;
  ctx.save(); ctx.translate(nx,ny); ctx.scale(flare,flare);
  var ng=ctx.createRadialGradient(-nw*.2,-nw*.22,nw*.05,0,0,nw*.85);
  ng.addColorStop(0,'#4a413a'); ng.addColorStop(.4,'#2c2520'); ng.addColorStop(1,'#191410');
  ctx.fillStyle=ng;
  ctx.beginPath();
  ctx.moveTo(-nw*.52,0);
  ctx.bezierCurveTo(-nw*.55,-nw*.42, nw*.55,-nw*.42, nw*.52,0);
  ctx.bezierCurveTo(nw*.45,nw*.34, -nw*.45,nw*.34, -nw*.52,0);
  ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.16)';
  ctx.beginPath();ctx.ellipse(-nw*.18,-nw*.2,nw*.15,nw*.07,-.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0d0a08';
  ctx.beginPath();ctx.ellipse(-nw*.19,nw*.03,nw*.075,nw*.12,.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(nw*.19,nw*.03,nw*.075,nw*.12,-.3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

document.getElementById('againBtn').addEventListener('click',function(){
  camX=0;camZ=0;heading=0;phase=0;speedNorm=0;sniffT=0;scents.length=0;
  moved=false;state='title';
  winEl.classList.remove('show');
  titleEl.classList.remove('gone');
});
})();
</script>
